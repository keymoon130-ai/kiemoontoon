<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>최기문웹툰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#1E6BFF; --blue-d:#1556D6; --blue-l:#EAF1FF;
  --ink:#1a1a1a; --sub:#6b6f76; --line:#e6e8eb; --bg:#fff; --soft:#f6f7f9;
  --red:#ff4d4f; --red-l:#fff1f0; --org:#fa8c16; --grn:#22a06b;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:default;opacity:.45}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:18px;height:60px}
.logo{font-weight:900;font-size:22px;color:var(--blue);letter-spacing:-1px;white-space:nowrap;cursor:pointer}
.logo span{color:var(--ink)}
.nav{display:flex;gap:4px}
.nav button{padding:8px 12px;font-weight:700;font-size:15px;color:var(--sub);border-radius:8px;position:relative}
.nav button.on{color:var(--ink)}
.nav button:hover{background:var(--soft)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;background:var(--soft);border-radius:20px;padding:0 12px;height:36px}
.search input{border:none;background:none;outline:none;width:160px;font-size:14px}
.btn{height:36px;padding:0 14px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover:not(:disabled){background:var(--blue-d)}
.btn-o{border:1px solid var(--line);background:#fff}
.btn-o:hover:not(:disabled){background:var(--soft)}
.btn-r{background:var(--red);color:#fff}
.btn-ro{border:1px solid #ffccc7;color:#cf1322;background:#fff}
.btn-g{background:var(--grn);color:#fff}
.cnt-badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:900;padding:0 5px;margin-left:4px;text-align:center}
.banbar{background:#cf1322;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:8px}

.banner{position:relative;height:260px;border-radius:14px;overflow:hidden;margin:20px 0 6px;background:var(--soft)}
.slide{position:absolute;inset:0;display:flex;align-items:flex-end;padding:28px;color:#fff;opacity:0;transition:opacity .6s;cursor:pointer;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(18px) brightness(.75);transform:scale(1.2)}
.slide .fg{position:absolute;right:40px;top:20px;bottom:20px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.slide .fg img,.slide .fg svg{width:100%;height:100%;object-fit:cover;display:block}
.slide .txt{position:relative;z-index:1;max-width:60%}
.slide .tag{display:inline-block;background:var(--blue);padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700;margin-bottom:8px}
.slide h2{font-size:30px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.slide p{font-size:15px;opacity:.95;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.slide.welcome{background:linear-gradient(120deg,#1E6BFF,#7aa7ff)}
.dots{position:absolute;right:20px;bottom:18px;display:flex;gap:6px;z-index:2}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots i.on{background:#fff;width:20px;border-radius:4px}

.days{display:flex;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto;scrollbar-width:none}
.days button{flex:1;min-width:58px;padding:14px 0;font-weight:700;font-size:15px;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1px}
.days button.on{color:var(--blue);border-color:var(--blue)}
.sortbar{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.sortbar .cnt{font-size:14px;color:var(--sub)}
.sorts button{font-size:13px;color:var(--sub);padding:4px 8px}
.sorts button.on{color:var(--ink);font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px;padding-bottom:30px}
.card{cursor:pointer}
.thumb{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--soft)}
.thumb img,.thumb svg{width:100%;height:100%;display:block;object-fit:cover;transition:transform .3s}
.card:hover .thumb img,.card:hover .thumb svg{transform:scale(1.04)}
.badges{position:absolute;top:6px;left:6px;display:flex;gap:4px}
.bdg{font-size:10px;font-weight:900;padding:2px 5px;border-radius:3px;color:#fff;display:inline-block;vertical-align:middle}
.bdg.up{background:var(--red)}.bdg.new{background:var(--blue)}.bdg.end{background:#333}
.bdg.pend{background:var(--org)}.bdg.rej{background:#cf1322}.bdg.ok{background:var(--grn)}
.card h3{font-size:15px;font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .au{font-size:13px;color:var(--sub);margin-top:2px}
.card .st{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:8px}
.star{color:var(--blue);font-weight:700}
.sec-t{font-size:20px;font-weight:900;margin:28px 0 14px;display:flex;align-items:center;gap:8px}
.sec-t small{font-size:13px;color:var(--sub);font-weight:500}
.empty{text-align:center;color:var(--sub);padding:60px 0;font-size:15px;line-height:1.7}
.loading{text-align:center;color:var(--sub);padding:80px 0}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

.dt{display:flex;gap:28px;padding:30px 0;border-bottom:1px solid var(--line)}
.dt .thumb{width:220px;flex:none}
.dt-info{flex:1;min-width:0}
.dt-info h1{font-size:28px;font-weight:900;word-break:keep-all}
.dt-info .au{color:var(--sub);margin:6px 0 2px;font-size:15px}
.dt-info .meta{font-size:14px;color:var(--sub);margin-bottom:14px}
.dt-info .desc{font-size:15px;line-height:1.7;color:#333;max-width:560px;white-space:pre-wrap}
.chips{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.chip{font-size:12px;background:var(--blue-l);color:var(--blue);padding:4px 10px;border-radius:12px;font-weight:700}
.dt-btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.dt-btns .btn{height:44px;padding:0 20px;font-size:15px}
.fav.on{background:var(--blue-l);color:var(--blue);border-color:var(--blue)}
.note{border-radius:8px;padding:12px 14px;font-size:14px;margin-top:14px;line-height:1.6}
.note.warn{background:#fff7e6;border:1px solid #ffd591;color:#ad4e00}
.note.bad{background:var(--red-l);border:1px solid #ffccc7;color:#cf1322}
.note.info{background:var(--blue-l);border:1px solid #c6d8ff;color:#1546a8}
.ep-head{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.ep{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ep:hover{background:var(--soft)}
.ep .et{width:120px;aspect-ratio:16/10;border-radius:6px;overflow:hidden;flex:none;background:var(--soft)}
.ep .et img{width:100%;height:100%;object-fit:cover;display:block}
.ep .en{font-size:15px;font-weight:500}
.ep .ei{font-size:13px;color:var(--sub);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.ep.read .en{color:#aaa}
.ep .acts{margin-left:auto;display:flex;gap:6px}
.sm{font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:700}
.sm.red{color:#cf1322;border-color:#ffccc7}
.sm.blue{color:var(--blue);border-color:#c6d8ff}

.viewer{background:#111;min-height:100vh}
.vbar{position:sticky;top:0;z-index:40;background:rgba(17,17,17,.96);color:#fff;display:flex;align-items:center;height:54px;padding:0 16px;gap:12px;border-bottom:1px solid #2a2a2a}
.vbar .vt{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar button{color:#fff;font-size:14px;padding:6px 10px;border-radius:6px;white-space:nowrap}
.vbar button:hover:not(:disabled){background:#2a2a2a}
.vbar .sp{margin-left:auto;display:flex;gap:4px}
.panels{max-width:720px;margin:0 auto;background:#fff;min-height:200px}
.panels img{display:block;width:100%;height:auto}
.vend{text-align:center;padding:40px 0;font-weight:900;font-size:22px;background:#fff}
.vfoot{max-width:720px;margin:0 auto;background:#fff;padding:24px 20px 60px}
.awords{background:var(--soft);border-radius:10px;padding:16px;font-size:14px;line-height:1.6;color:#444;white-space:pre-wrap}
.awords b{display:block;margin-bottom:4px;color:var(--ink)}
.rate{text-align:center;padding:26px 0;border-bottom:1px solid var(--line)}
.rate .stars{font-size:30px;letter-spacing:2px;color:#ddd;user-select:none}
.rate .stars span{cursor:pointer}
.rate .stars span.on{color:var(--blue)}
.rate .rv{font-size:14px;color:var(--sub);margin-top:6px}
.navep{display:flex;gap:8px;margin:20px 0}
.navep button{flex:1;height:46px;border:1px solid var(--line);border-radius:8px;font-weight:700}
.navep .mid{flex:0 0 90px}
.cmt-w{display:flex;gap:8px;margin:16px 0}
.cmt-w textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;resize:none;height:64px;font-size:14px;outline:none}
.cmt-w textarea:focus{border-color:var(--blue)}
.cmt-w .btn{height:64px}
.cmt{padding:14px 0;border-bottom:1px solid var(--line)}
.cmt .cn{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.cmt .cn .best{font-size:10px;background:var(--blue);color:#fff;padding:1px 5px;border-radius:3px}
.cmt .cn .dd{font-weight:400;color:var(--sub);font-size:12px}
.cmt p{font-size:14px;margin:6px 0;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.cmt .ca{display:flex;gap:10px;font-size:12px;color:var(--sub)}
.cmt .ca button{font-size:12px;color:var(--sub);border:1px solid var(--line);padding:3px 8px;border-radius:4px}
.cmt .ca button.on{color:var(--blue);border-color:var(--blue)}
.cmt .ca .del{color:var(--red);border-color:#ffd0d0;margin-left:auto}

.rk{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rk:hover{background:var(--soft)}
.rk .n{width:30px;text-align:center;font-size:22px;font-weight:900;color:var(--sub);flex:none}
.rk .n.top{color:var(--blue)}
.rk .thumb{width:70px;flex:none}
.rk h3{font-size:16px;font-weight:700}
.rk .au{font-size:13px;color:var(--sub);margin-top:3px}
.pills{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.pills button{padding:8px 14px;border-radius:20px;border:1px solid var(--line);font-size:14px;font-weight:500}
.pills button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.prof{display:flex;align-items:center;gap:16px;padding:26px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ava{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;flex:none}
.prof h2{font-size:20px}
.prof p{font-size:14px;color:var(--sub);margin-top:2px}
.role{font-size:11px;font-weight:900;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}
.role.reader{background:var(--soft);color:var(--sub)}.role.author{background:var(--blue-l);color:var(--blue)}.role.admin{background:#fff1f0;color:#cf1322}
.subtabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:6px;overflow-x:auto;scrollbar-width:none}
.subtabs button{padding:14px 0;font-weight:700;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs button.on{color:var(--ink);border-color:var(--ink)}
.box{border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:18px}
.box h3{font-size:16px;margin-bottom:6px}
.box p.d{font-size:14px;color:var(--sub);line-height:1.6}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;font-size:15px}
.row .s{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}
.row .mini{width:54px;flex:none}
.notice{padding:14px 0;border-bottom:1px solid var(--line)}
.notice .nt{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.notice .nm{font-size:14px;color:#444;margin-top:4px;white-space:pre-wrap}
.notice .nd{font-size:12px;color:var(--sub);margin-top:4px}
.notice.unseen{background:#f7faff}

.mroot .mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.modal.wide{max-width:780px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.mh h2{font-size:18px}
.mh .x{font-size:24px;color:var(--sub);line-height:1}
.mb{padding:20px 22px}
.mf{padding:14px 22px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mf .btn{height:42px;padding:0 20px}
.mtabs{display:flex;background:var(--soft);border-radius:8px;padding:4px;margin-bottom:18px}
.mtabs button{flex:1;padding:9px;border-radius:6px;font-weight:700;font-size:14px;color:var(--sub)}
.mtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fl{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.fl:first-child{margin-top:0}
.fl small{font-weight:400;color:var(--sub)}
.fi{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;background:#fff}
.fi:focus{border-color:var(--blue)}
textarea.fi{resize:vertical;min-height:80px}
.err{color:#cf1322;font-size:13px;margin-top:10px;min-height:18px}
.dayck{display:flex;gap:6px;flex-wrap:wrap}
.dayck button{width:40px;height:36px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-weight:700}
.dayck button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.drop{border:2px dashed #c9d6f5;background:#f8faff;border-radius:10px;padding:18px;text-align:center;color:var(--sub);font-size:14px;cursor:pointer;display:flex;align-items:center;gap:14px}
.drop b{color:var(--blue)}
.drop .pv{width:72px;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:#fff;flex:none;border:1px solid var(--line)}
.drop .pv img,.drop .pv canvas{width:100%;height:100%;object-fit:cover;display:block}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qchips button{font-size:12px;border:1px solid var(--line);border-radius:14px;padding:5px 10px}
.qchips button:hover{border-color:var(--blue);color:var(--blue)}
.lv{display:flex;flex-direction:column;gap:6px}
.lv label{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14px}
.lv label:has(input:checked){border-color:var(--red);background:var(--red-l)}
.lv label b{display:block}
.lv label span{font-size:12px;color:var(--sub)}
.lv input{margin-top:3px}
.prev-pages{max-width:480px;margin:0 auto;background:#fff;border:1px solid var(--line)}
.prev-pages img{display:block;width:100%}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(20,20,20,.92);color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;opacity:0;transition:.3s;z-index:500;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{border-top:1px solid var(--line);background:var(--soft);padding:26px 0;font-size:13px;color:var(--sub);text-align:center}
.bnav{display:none}

/* ===== editor ===== */
#editor{position:fixed;inset:0;z-index:200;background:#2b2d31;display:flex;flex-direction:column;color:#fff;user-select:none}
#editor[hidden]{display:none}
.ed-top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#1e1f22;border-bottom:1px solid #000;flex-wrap:wrap}
.ed-top .x{color:#fff;font-size:14px;padding:6px 10px;border-radius:6px;background:#383a40}
.ed-top input{background:#383a40;border:1px solid #4e5058;color:#fff;border-radius:6px;padding:7px 10px;font-size:14px;outline:none;width:180px}
.ed-top input:focus{border-color:var(--blue)}
.ed-work{font-weight:900;font-size:14px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-req{display:flex;gap:10px;font-size:12px;margin-left:auto;flex-wrap:wrap}
.ed-req span{padding:5px 9px;border-radius:12px;background:#383a40;white-space:nowrap}
.ed-req span.ok{background:#1f5135;color:#9be9bd}
.ed-req span.no{background:#5c2224;color:#ffb3b3}
.ed-body{flex:1;display:flex;min-height:0}
.ed-tools{width:76px;background:#1e1f22;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;overflow-y:auto;flex:none}
.tl{width:60px;padding:6px 0;border-radius:8px;font-size:11px;color:#ccc;display:flex;flex-direction:column;align-items:center;gap:2px}
.tl i{font-style:normal;font-size:20px;line-height:1}
.tl:hover{background:#383a40}
.tl.on{background:var(--blue);color:#fff}
.tsep{width:50px;height:1px;background:#3a3c42;margin:4px 0}
.colors{display:grid;grid-template-columns:repeat(2,24px);gap:5px;padding:4px 0}
.colors button{width:24px;height:24px;border-radius:50%;border:2px solid #555}
.colors button.on{border-color:#fff;box-shadow:0 0 0 2px var(--blue)}
.cpick{width:52px;height:28px;border:none;background:none;cursor:pointer}
.sizebox{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#ccc;gap:4px}
.sizebox input{writing-mode:vertical-lr;direction:rtl;height:100px;width:24px}
.ed-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px;min-width:0;position:relative}
.ed-cw{position:relative;box-shadow:0 6px 30px rgba(0,0,0,.5);background:#fff;line-height:0}
.ed-cw canvas{display:block;touch-action:none}
.ed-cw canvas.main{cursor:crosshair}
.ed-cw canvas.ov{position:absolute;inset:0;pointer-events:none}
.ed-cw canvas.ov.act{pointer-events:auto;cursor:move}
.ed-cuts{width:150px;background:#1e1f22;overflow-y:auto;padding:10px;flex:none;display:flex;flex-direction:column;gap:8px}
.cutit{position:relative;border-radius:6px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#fff;line-height:0}
.cutit.on{border-color:var(--blue)}
.cutit.empty::after{content:'빈 컷';position:absolute;right:4px;bottom:4px;background:#cf1322;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;line-height:1.5}
.cutit img{width:100%;display:block}
.cutit .no{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:900;padding:1px 6px;border-radius:3px;line-height:1.5}
.cutit .ops{position:absolute;right:3px;top:3px;display:none;gap:2px}
.cutit:hover .ops,.cutit.on .ops{display:flex}
.cutit .ops button{background:rgba(0,0,0,.7);color:#fff;font-size:11px;width:20px;height:20px;border-radius:4px;line-height:1}
.addcut{border:2px dashed #555;border-radius:6px;padding:10px 4px;text-align:center;font-size:12px;color:#ccc;display:flex;flex-direction:column;gap:6px}
.addcut button{color:#fff;font-weight:700;font-size:13px}

<body>
<div id="banbar" class="banbar" hidden></div>
<header id="hdr">

    <a class="logo" onclick="go('home')">최기문<span>웹툰</span></a>
    <nav class="nav">
      <button data-nav="home">홈</button>
      <button data-nav="ranking">랭킹</button>
      <button data-nav="my">MY</button>
      <button data-nav="admin" class="adm-only" hidden>관리<span class="cnt-badge pend-cnt" hidden></span></button>
    </nav>
    <div class="hd-r">
      <div class="search"><input id="q" placeholder="작품, 작가 검색" onkeydown="if(event.key==='Enter')doSearch(this.value)"></div>
      <button class="btn btn-p" onclick="startUpload()">+ 작품 올리기</button>

  <button data-nav="ranking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>랭킹</button>
  <button onclick="startUpload()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>올리기</button>
  <button data-nav="admin" class="adm-only" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>관리<span class="cnt-badge pend-cnt" hidden style="position:absolute;top:4px;right:18%"></span></button>

<!-- ============ 그림판 ============ -->

</div>

<script>
/* ================= 설정 ================= */
const CFG={
  url:'https://nogwawurgnbqbcwyqcno.supabase.co',
  key:'sb_publishable_uMekmd5oK_EmsYsu1WwfZA_z5Jqu2Kb',
  domain:'kiemoontoon.com',   // 아이디를 Supabase 이메일 형식으로 바꿀 때만 쓰는 가짜 도메인
  bucket:'toon',
  minCuts:8, minSec:600, minInk:0.02
};
const sb=supabase.createClient(CFG.url,CFG.key);
const DAYS=['월','화','수','목','금','토','일'];
const GENRES=['일상','개그','판타지','액션','로맨스','스릴러','학원','드라마','공포'];
const TODAY=DAYS[(new Date().getDay()+6)%7];

let ME=null, PROF=null;
const S={day:TODAY,sort:'pop',rk:'views',myTab:'fav',admTab:'pending',epOrder:'desc',q:'',bannerI:0};
const C={works:null,worksAt:0};

/* ================= 유틸 ================= */
const $=s=>document.querySelector(s);
const app=$('#app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms||2200)}
function fmt(n){n=n||0;return n>=10000?(n/10000).toFixed(1)+'만':n.toLocaleString()}
function rating(o){return o&&o.rating_count?(o.rating_sum/o.rating_count).toFixed(2):'-'}
function dstr(t){if(!t)return'';const d=new Date(t);return `${String(d.getFullYear()).slice(2)}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
function ago(t){const s=(Date.now()-new Date(t))/1000;if(s<60)return'방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';if(s<86400*7)return Math.floor(s/86400)+'일 전';return dstr(t)}
function pub(p){return p?`${CFG.url}/storage/v1/object/public/${CFG.bucket}/${p.split('/').map(encodeURIComponent).join('/')}`:''}
function mmss(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function idEmail(id){return 'u'+[...new TextEncoder().encode(id)].map(b=>b.toString(16).padStart(2,'0')).join('')+'@'+CFG.domain}
function errMsg(e){const m=(e&&(e.message||e.error_description))||String(e);
  if(/Invalid login/i.test(m))return'아이디 또는 비밀번호가 틀렸어요';
  if(/already registered|already been registered/i.test(m))return'이미 있는 아이디예요';
  if(/row-level security/i.test(m))return'권한이 없어요 (정지 상태이거나 작가가 아니에요)';
  if(/Password should be/i.test(m))return'비밀번호는 6자 이상이어야 해요';
  if(/Failed to fetch/i.test(m))return'인터넷 연결을 확인해 주세요';
  return m}
const isAdmin=()=>PROF&&PROF.role==='admin';
const isAuthor=()=>PROF&&(PROF.role==='author'||PROF.role==='admin');
function banned(p){p=p||PROF;return !!p&&(p.perma_ban||(p.banned_until&&new Date(p.banned_until)>new Date()))}
function banText(p){p=p||PROF;return p.perma_ban?'영구 정지':`${new Date(p.banned_until).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}까지 정지`}
function loadingHTML(t){return `<div class="loading"><div class="spin"></div>${t||'불러오는 중…'}</div>`}
function hue(id){return (Number(id)*67)%360}
function fbThumb(w){const h=hue(w.id);return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice"><rect width="300" height="400" fill="hsl(${h},60%,62%)"/><text x="150" y="210" text-anchor="middle" font-size="30" font-weight="900" fill="#fff" font-family="Noto Sans KR">${esc((w.title||'').slice(0,9))}</text></svg>`}
function thumbHTML(w){return w.thumb_path?`<img src="${pub(w.thumb_path)}" loading="lazy" alt="">`:fbThumb(w)}
function authorName(w){return w.profiles?w.profiles.display_name:''}
function isUp(w){return w.last_episode_at&&Date.now()-new Date(w.last_episode_at)<72*3600e3}
function isNew(w){return Date.now()-new Date(w.created_at)<14*86400e3}

/* ================= 모달 ================= */
function modal(html,{wide,onClose}={}){
  const bg=document.createElement('div');bg.className='mbg';
  bg.innerHTML=`<div class="modal ${wide?'wide':''}">${html}</div>`;
  bg.addEventListener('mousedown',e=>{if(e.target===bg){bg._close()}});
  bg._close=()=>{bg.remove();onClose&&onClose()};
  bg.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>bg._close());
  $('#mroot').appendChild(bg);return bg;
}
function ask(msg,{ok='확인',cancel='취소',danger}={}){
  return new Promise(res=>{const m=modal(`<div class="mb" style="padding-top:26px;font-size:15px;line-height:1.6;white-space:pre-wrap">${esc(msg)}</div>
    <div class="mf">${cancel?`<button class="btn btn-o" data-v="0">${cancel}</button>`:''}<button class="btn ${danger?'btn-r':'btn-p'}" data-v="1">${ok}</button></div>`,{onClose:()=>res(false)});
    m.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{m.remove();res(b.dataset.v==='1')});});
}
function choose(msg,btns){
  return new Promise(res=>{const m=modal(`<div class="mb" style="padding-top:26px;font-size:15px;line-height:1.6">${esc(msg)}</div>
    <div class="mf">${btns.map((b,i)=>`<button class="btn ${b.cls||'btn-o'}" data-i="${i}">${b.t}</button>`).join('')}</div>`,{onClose:()=>res(null)});
    m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{m.remove();res(btns[+b.dataset.i].v)});});
}

/* ================= 라우터 ================= */
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h}
window.addEventListener('hashchange',route);
async function route(){
  const h=location.hash.slice(1)||'home';
  const [p,arg]=h.split(/-(.*)/s);
  document.body.classList.toggle('vmode',p==='view');
  $('#hdr').hidden=p==='view';$('#ftr').hidden=p==='view';
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===p));
  window.scrollTo(0,0);
  try{
    if(p==='work')await pageWork(+arg);
    else if(p==='view')await pageView(+arg);
    else if(p==='ranking')await pageRanking();
    else if(p==='my')await pageMy();
    else if(p==='admin')await pageAdmin();
    else if(p==='search')await pageSearch();
    else await pageHome();
  }catch(e){console.error(e);app.innerHTML=`<div class="wrap"><div class="empty">문제가 생겼어요 😢<br><small>${esc(errMsg(e))}</small><br><br><button class="btn btn-o" onclick="route()">다시 시도</button></div></div>`}
}
function refresh(){route()}

/* ================= 인증 ================= */
async function loadProfile(){
  if(!ME){PROF=null;return}
  const {data,error}=await sb.from('profiles').select('*').eq('id',ME.id).maybeSingle();
  if(error)console.error(error);
  PROF=data||null;
}
function paintAuth(){
  $('#loginBtn').textContent=ME&&PROF?PROF.display_name+' 님':'로그인';
  document.querySelectorAll('.adm-only').forEach(e=>e.hidden=!isAdmin());
  const bb=$('#banbar');
  if(PROF&&banned()){bb.hidden=false;bb.textContent=`🚫 ${banText()} 상태예요. 보기만 할 수 있어요.`}else bb.hidden=true;
}
function openLogin(tab){
  const m=modal(`<div class="mh"><h2>최기문웹툰</h2><button class="x" data-close>×</button></div>
  <div class="mb"><div class="mtabs"><button data-t="in">로그인</button><button data-t="up">회원가입</button></div>
    <label class="fl">아이디 <small>(한글·영문·숫자 2~16자)</small></label><input class="fi" id="lgId" autocomplete="username" maxlength="16">
    <label class="fl">비밀번호</label><input class="fi" id="lgPw" type="password" autocomplete="current-password">
    <div id="lgPw2w" hidden><label class="fl">비밀번호 확인</label><input class="fi" id="lgPw2" type="password" autocomplete="new-password"></div>
    <div class="err" id="lgErr"></div></div>
  <div class="mf"><button class="btn btn-p" style="width:100%" id="lgGo">로그인</button></div>`);
  let mode=tab||'in';
  const set=t=>{mode=t;m.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));m.querySelector('#lgPw2w').hidden=t!=='up';m.querySelector('#lgGo').textContent=t==='up'?'가입하기':'로그인';m.querySelector('#lgErr').textContent=''};
  m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>set(b.dataset.t));set(mode);
  const submit=async()=>{
    const id=m.querySelector('#lgId').value.trim().toLowerCase(),pw=m.querySelector('#lgPw').value,er=m.querySelector('#lgErr'),btn=m.querySelector('#lgGo');
    er.textContent='';
    if(!/^[a-z0-9가-힣_]{2,16}$/.test(id)){er.textContent='아이디는 한글·영문·숫자·_ 2~16자로 해 주세요';return}
    if(new TextEncoder().encode(id).length>30){er.textContent='아이디가 너무 길어요 (한글은 10자까지)';return}
    if(pw.length<6){er.textContent='비밀번호는 6자 이상이어야 해요';return}
    btn.disabled=true;
    try{
      if(mode==='up'){
        if(pw!==m.querySelector('#lgPw2').value){er.textContent='비밀번호가 서로 달라요';btn.disabled=false;return}
        const {data:ex}=await sb.from('profiles').select('id').eq('username',id).maybeSingle();
        if(ex){er.textContent='이미 있는 아이디예요';btn.disabled=false;return}
        const {data,error}=await sb.auth.signUp({email:idEmail(id),password:pw,options:{data:{username:id}}});
        if(error)throw error;
        if(!data.session){er.textContent='가입은 됐는데 자동 로그인이 안 됐어요. Supabase에서 Confirm email이 꺼져 있는지 확인해 주세요.';btn.disabled=false;return}
        toast(`환영해요, ${id} 님!`);
      }else{
        const {error}=await sb.auth.signInWithPassword({email:idEmail(id),password:pw});
        if(error)throw error;
        toast('로그인했어요');
      }
      m._close();
    }catch(e){er.textContent=errMsg(e);btn.disabled=false}
  };
  m.querySelector('#lgGo').onclick=submit;
  m.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')submit()});
  setTimeout(()=>m.querySelector('#lgId').focus(),50);
}
async function logout(){if(!await ask('로그아웃할까요?'))return;await sb.auth.signOut();toast('로그아웃했어요');go('home')}
function needLogin(){if(!ME){openLogin();return true}return false}
function needAct(){if(needLogin())return true;if(banned()){toast(`${banText()} 상태라 할 수 없어요`);return true}return false}

/* ================= 데이터 ================= */
async function getWorks(force){
  if(!force&&C.works&&Date.now()-C.worksAt<20000)return C.works;
  const {data,error}=await sb.from('works').select('*, profiles(display_name,username)').eq('status','approved').order('created_at',{ascending:false});
  if(error)throw error;C.works=data;C.worksAt=Date.now();return data;
}
function recentGet(){try{return JSON.parse(localStorage.getItem('kmt_recent')||'[]')}catch(e){return[]}}
function recentAdd(r){try{const l=recentGet().filter(x=>x.w!==r.w);l.unshift(r);localStorage.setItem('kmt_recent',JSON.stringify(l.slice(0,20)))}catch(e){}}
function readGet(){try{return new Set(JSON.parse(localStorage.getItem('kmt_read')||'[]'))}catch(e){return new Set()}}
function readAdd(id){try{const s=readGet();s.add(id);localStorage.setItem('kmt_read',JSON.stringify([...s].slice(-2000)))}catch(e){}}

/* ================= 카드 ================= */
function cardHTML(w){
  return `<div class="card" onclick="go('work-${w.id}')">
    <div class="thumb">${thumbHTML(w)}<div class="badges">${w.finished?'<span class="bdg end">완결</span>':''}${isNew(w)?'<span class="bdg new">NEW</span>':''}${isUp(w)&&!w.finished?'<span class="bdg up">UP</span>':''}</div></div>
    <h3>${esc(w.title)}</h3><div class="au">${esc(authorName(w))}</div>
    <div class="st"><span class="star">★ ${rating(w)}</span><span>👁 ${fmt(w.views)}</span></div></div>`;
}

/* ================= 홈 ================= */
async function pageHome(){
  if(!C.works)app.innerHTML=loadingHTML();
  const all=await getWorks();
  const top=[...all].sort((a,b)=>b.views-a.views).slice(0,4);
  let list;
  if(S.day==='완결')list=all.filter(w=>w.finished);
  else if(S.day==='신작')list=all.filter(isNew);

async function loadComments(epId){
  const {data:cs,error}=await sb.from('comments').select('*, profiles(display_name,username)').eq('episode_id',epId).order('created_at',{ascending:false}).limit(300);
  if(error){$('#cmtArea').innerHTML='';return}
  let liked=new Set();
  if(ME&&cs.length){const {data:l}=await sb.from('comment_likes').select('comment_id').eq('user_id',ME.id).in('comment_id',cs.map(c=>c.id));liked=new Set((l||[]).map(x=>x.comment_id))}
  const best=[...cs].filter(c=>c.like_count>=3).sort((a,b)=>b.like_count-a.like_count).slice(0,3);
  const bestIds=new Set(best.map(c=>c.id));

    <div class="ca"><button class="${liked.has(c.id)?'on':''}" onclick="likeCmt(${c.id},${liked.has(c.id)},${epId})">👍 ${c.like_count}</button>${ME&&(c.user_id===ME.id||isAdmin())?`<button class="del" onclick="delCmt(${c.id},${epId})">삭제</button>`:''}</div></div>`;
  $('#cmtArea').innerHTML=`<div style="font-weight:900;font-size:16px">댓글 <span style="color:var(--blue)">${cs.length}</span></div>
    <div class="cmt-w"><textarea id="cmtIn" placeholder="${ME?(banned()?'정지 상태라 댓글을 달 수 없어요':'댓글을 남겨주세요'):'로그인 후 댓글을 남길 수 있어요'}" maxlength="300" ${ME&&!banned()?'':'readonly onclick="needLogin()"'}></textarea><button class="btn btn-p" onclick="addCmt(${epId})">등록</button></div>

/* ================= 이미지 도우미 ================= */
function loadImg(src,cors){return new Promise((res,rej)=>{const i=new Image();if(cors)i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function fileToCanvas(file,W,H){
  const url=URL.createObjectURL(file);try{const img=await loadImg(url);return coverCanvas(img,W,H)}finally{URL.revokeObjectURL(url)}
}
function coverCanvas(src,W,H){
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const sw=src.naturalWidth||src.width,sh=src.naturalHeight||src.height;
  const s=Math.max(W/sw,H/sh);x.drawImage(src,(W-sw*s)/2,(H-sh*s)/2,sw*s,sh*s);return c;
}
function titleCard(title,author){
  const c=document.createElement('canvas');c.width=480;c.height=640;const x=c.getContext('2d');
  const h=Math.floor(Math.random()*360);const g=x.createLinearGradient(0,0,0,640);
  g.addColorStop(0,`hsl(${h},70%,68%)`);g.addColorStop(1,`hsl(${h+40},60%,38%)`);x.fillStyle=g;x.fillRect(0,0,480,640);
  for(let i=0;i<7;i++){x.fillStyle='rgba(255,255,255,.08)';x.beginPath();x.arc(Math.random()*480,Math.random()*640,30+Math.random()*90,0,7);x.fill()}
  x.fillStyle='#fff';x.textAlign='center';x.font='900 52px "Noto Sans KR",sans-serif';
  const lines=[];let cur='';for(const ch of title){if(x.measureText(cur+ch).width>400){lines.push(cur);cur=ch}else cur+=ch}lines.push(cur);
  lines.slice(0,4).forEach((l,i)=>x.fillText(l,240,300+i*62-(lines.length-1)*31));
  x.font='500 24px "Noto Sans KR",sans-serif';x.globalAlpha=.9;x.fillText(author||'',240,580);return c;
}
function canvasBlob(c,q){return new Promise(res=>c.toBlob(b=>{if(b&&b.type==='image/webp')return res(b);c.toBlob(b2=>res(b2),'image/jpeg',q)},'image/webp',q))}
async function uploadCanvas(c,base,q){
  const blob=await canvasBlob(c,q||0.85);const ext=blob.type==='image/webp'?'webp':'jpg';const path=`${base}.${ext}`;
  const {error}=await sb.storage.from(CFG.bucket).upload(path,blob,{contentType:blob.type,cacheControl:'31536000',upsert:false});
  if(error)throw error;return path;
}

  if(t==='text')toast('말풍선을 넣을 곳을 눌러 주세요');if(t==='fx')toast('효과선의 중심을 눌러 주세요');if(t==='line')toast('끌어서 직선을 그려요')}

function edFit(){

}

function edPos(e,c){const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function edPush(){const c=cur();ED.undo.push(c.x.getImageData(0,0,c.c.width,c.c.height));if(ED.undo.length>20)ED.undo.shift();ED.redo=[]}
function edUndo(){const c=cur();if(!ED.undo.length)return toast('되돌릴 게 없어요');ED.redo.push(c.x.getImageData(0,0,c.c.width,c.c.height));c.x.putImageData(ED.undo.pop(),0,0);edChanged()}
function edRedo(){const c=cur();if(!ED.redo.length)return;ED.undo.push(c.x.getImageData(0,0,c.c.width,c.c.height));c.x.putImageData(ED.redo.pop(),0,0);edChanged()}
function edAct(){ED.lastAct=Date.now()}
let _thumbT=null;
function edChanged(){ED.dirty=true;edAct();clearTimeout(_thumbT);_thumbT=setTimeout(()=>{edCalcInk(cur());edRenderCuts();edReq()},250)}
function edCalcInk(cut){
  const t=document.createElement('canvas');const w=90,h=Math.round(90*cut.c.height/cut.c.width);t.width=w;t.height=h;
  const x=t.getContext('2d');x.drawImage(cut.c,0,0,w,h);const d=x.getImageData(0,0,w,h).data;let n=0;
  for(let i=0;i<d.length;i+=4)if(d[i]+d[i+1]+d[i+2]<720)n++;
  cut.ink=n/(w*h);cut.thumb=t.toDataURL('image/jpeg',.7);
}
function edBind(c){
  let drawing=false,last=null,pts=[],snap=null;
  c.onpointerdown=e=>{
    if(ED.placing)return;e.preventDefault();c.setPointerCapture(e.pointerId);const p=edPos(e,c);const ctx=cur().x;edAct();
    if(ED.tool==='fill'){edPush();floodFill(ctx,Math.floor(p.x),Math.floor(p.y),ED.color);edChanged();return}
    if(ED.tool==='fx'){edPush();speedLines(ctx,p.x,p.y);edChanged();return}
    if(ED.tool==='text'){edTextPanel(p);return}
    edPush();drawing=true;last=p;pts=[p];
    if(ED.tool==='marker'||ED.tool==='line')snap=ctx.getImageData(0,0,c.width,c.height);
    if(ED.tool==='pen'||ED.tool==='eraser'){ctx.save();ctx.fillStyle=ED.tool==='eraser'?'#fff':ED.color;ctx.beginPath();ctx.arc(p.x,p.y,lw(e)/2,0,7);ctx.fill();ctx.restore()}
  };
  c.onpointermove=e=>{
    if(!drawing)return;e.preventDefault();edAct();const ctx=cur().x;
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of (evs.length?evs:[e])){
      const p=edPos(ev,c);
      if(ED.tool==='pen'||ED.tool==='eraser'){
        ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ED.tool==='eraser'?'#fff':ED.color;ctx.lineWidth=lw(ev);
        ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore();last=p;
      }else if(ED.tool==='marker'){pts.push(p)}
      else if(ED.tool==='line'){pts=[pts[0],p]}
    }
    if(ED.tool==='marker'||ED.tool==='line'){
      ctx.putImageData(snap,0,0);ctx.save();ctx.globalAlpha=ED.tool==='marker'?0.35:1;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ED.color;
      ctx.lineWidth=ED.tool==='marker'?ED.size*3:ED.size;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];ctx.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2)}
      const lp=pts[pts.length-1];ctx.lineTo(lp.x,lp.y);ctx.stroke();ctx.restore();
    }
  };
  const end=()=>{if(!drawing)return;drawing=false;snap=null;edChanged()};
  c.onpointerup=end;c.onpointercancel=end;
}
function lw(e){const base=ED.tool==='eraser'?ED.size*3:ED.size;if(e.pointerType==='pen'&&e.pressure>0)return Math.max(0.6,base*(0.25+e.pressure*1.5));return base}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function floodFill(ctx,sx,sy,hex){
  const W=ctx.canvas.width,H=ctx.canvas.height;if(sx<0||sy<0||sx>=W||sy>=H)return;
  const img=ctx.getImageData(0,0,W,H),d=img.data,[fr,fg,fb]=hexRgb(hex);
  const s=(sy*W+sx)*4,tr=d[s],tg=d[s+1],tb=d[s+2];
  if(Math.abs(tr-fr)+Math.abs(tg-fg)+Math.abs(tb-fb)<10)return;
  const tol=110,vis=new Uint8Array(W*H);
  const m=i=>{const k=i*4;return Math.abs(d[k]-tr)+Math.abs(d[k+1]-tg)+Math.abs(d[k+2]-tb)<=tol};
  const set=i=>{const k=i*4;d[k]=fr;d[k+1]=fg;d[k+2]=fb;d[k+3]=255;vis[i]=1};
  const stack=[sx,sy];
  while(stack.length){
    const y=stack.pop();let x=stack.pop();let i=y*W+x;
    while(x>=0&&!vis[i]&&m(i)){x--;i--}x++;i++;
    let up=false,dn=false;
    while(x<W&&!vis[i]&&m(i)){
      set(i);
      if(y>0){const j=i-W;if(!vis[j]&&m(j)){if(!up){stack.push(x,y-1);up=true}}else up=false}
      if(y<H-1){const j=i+W;if(!vis[j]&&m(j)){if(!dn){stack.push(x,y+1);dn=true}}else dn=false}
      x++;i++;
    }
  }
  // 경계 안티앨리어싱 틈 메우기 (1px 확장)
  const grow=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;if(vis[i])continue;if(vis[i-1]||vis[i+1]||vis[i-W]||vis[i+W]){const k=i*4;if(d[k]+d[k+1]+d[k+2]>200)grow.push(i)}}
  grow.forEach(i=>{const k=i*4;d[k]=fr;d[k+1]=fg;d[k+2]=fb});
  ctx.putImageData(img,0,0);
}
function speedLines(ctx,cx,cy){
  const W=ctx.canvas.width,H=ctx.canvas.height,R=Math.hypot(W,H),inner=60+ED.size*10;
  ctx.save();ctx.fillStyle=ED.color;
  for(let i=0;i<110;i++){const a=Math.random()*Math.PI*2,w=0.003+Math.random()*0.011,r0=inner*(0.8+Math.random()*0.7);
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a-w)*R,cy+Math.sin(a-w)*R);ctx.lineTo(cx+Math.cos(a+w)*R,cy+Math.sin(a+w)*R);ctx.closePath();ctx.fill()}
  ctx.restore();
}
function edFrame(){edPush();const c=cur();c.x.save();c.x.strokeStyle='#111';const t=Math.max(4,ED.size);c.x.lineWidth=t;c.x.strokeRect(t/2,t/2,c.c.width-t,c.c.height-t);c.x.restore();edChanged()}
async function edClearCut(){if(!await ask('이 컷을 하얗게 비울까요?',{ok:'비우기',danger:true}))return;edPush();const c=cur();c.x.fillStyle='#fff';c.x.fillRect(0,0,c.c.width,c.c.height);edChanged()}

/* 말풍선 */
function edTextPanel(p){
  const pn=$('#edPanel');let style='speech',fs=28;
  pn.hidden=false;pn.innerHTML=`<textarea id="tpT" placeholder="대사를 적어요 (줄바꿈 가능)"></textarea>
    <div class="opts">${[['speech','💬 말풍선'],['think','💭 생각'],['shout','💥 외침'],['box','📦 나레이션'],['plain','🔤 글자만']].map(([k,v])=>`<button data-s="${k}" class="${k===style?'on':''}">${v}</button>`).join('')}</div>
    <div class="pr">글자 크기 <input type="range" id="tpF" min="14" max="72" value="${fs}"><span id="tpFv">${fs}</span></div>
    <div class="pb"><button onclick="edClosePanel()">취소</button><button class="go" id="tpGo">넣기</button></div>`;
  pn.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{style=b.dataset.s;pn.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  pn.querySelector('#tpF').oninput=e=>{fs=+e.target.value;pn.querySelector('#tpFv').textContent=fs};
  pn.querySelector('#tpGo').onclick=()=>{const t=pn.querySelector('#tpT').value.trim();if(!t)return;edPush();drawBubble(cur().x,p.x,p.y,t,style,fs);edClosePanel();edChanged()};
  setTimeout(()=>pn.querySelector('#tpT').focus(),30);
}
function edClosePanel(){$('#edPanel').hidden=true;$('#edPanel').innerHTML=''}
function drawBubble(ctx,x,y,text,style,fs){
  ctx.save();ctx.font=`700 ${fs}px "Noto Sans KR",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const lines=text.split('\n');const tw=Math.max(...lines.map(l=>ctx.measureText(l).width));const lh=fs*1.3,th=lh*lines.length;
  const rx=tw/2+fs*1.1,ry=th/2+fs*0.9;
  const shape=()=>{ctx.beginPath();
    if(style==='speech'){ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.moveTo(x-rx*0.25,y+ry*0.8);ctx.lineTo(x-rx*0.5,y+ry+fs*1.3);ctx.lineTo(x+rx*0.05,y+ry*0.85)}
    else if(style==='think'){ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.moveTo(x-rx*0.4+fs*0.4,y+ry+fs*0.5);ctx.arc(x-rx*0.4,y+ry+fs*0.5,fs*0.4,0,7);ctx.moveTo(x-rx*0.6+fs*0.25,y+ry+fs*1.2);ctx.arc(x-rx*0.6,y+ry+fs*1.2,fs*0.25,0,7)}
    else if(style==='shout'){const n=22;for(let i=0;i<=n*2;i++){const a=i/(n*2)*Math.PI*2,k=i%2?1.0:1.32;const px=x+Math.cos(a)*rx*k,py=y+Math.sin(a)*ry*k;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
    else if(style==='box'){ctx.rect(x-tw/2-fs*0.7,y-th/2-fs*0.5,tw+fs*1.4,th+fs)}
  };
  if(style!=='plain'){ctx.lineJoin='round';ctx.lineWidth=7;ctx.strokeStyle='#111';shape();ctx.stroke();ctx.fillStyle='#fff';shape();ctx.fill()}
  lines.forEach((l,i)=>{const ly=y-th/2+lh*(i+0.5);if(style==='plain'){ctx.lineWidth=fs/5;ctx.strokeStyle='#fff';ctx.strokeText(l,x,ly);ctx.fillStyle=ED.color}else ctx.fillStyle='#111';ctx.fillText(l,x,ly)});
  ctx.restore();
}

/* 이미지 불러오기 */
function edImage(){$('#edImgFile').value='';$('#edImgFile').click()}
$('#edImgFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);
  try{const img=await loadImg(url);const c=cur().c;const s=Math.min(c.width/img.naturalWidth,c.height/img.naturalHeight,1);
    ED.placing={img,url,scale:s,base:s,x:(c.width-img.naturalWidth*s)/2,y:(c.height-img.naturalHeight*s)/2};edPlaceUI();edDrawPlace()}
  catch(_){toast('이미지를 열 수 없어요');URL.revokeObjectURL(url)}
};
function edPlaceUI(){
  const pn=$('#edPanel');pn.hidden=false;ED.ov.classList.add('act');
  pn.innerHTML=`<div style="font-size:13px;margin-bottom:6px">이미지를 끌어서 위치를 옮기고, 크기를 조절한 뒤 <b>확정</b>을 누르세요. 확정 후 그 위에 덧그릴 수 있어요.</div>
    <div class="pr">크기 <input type="range" id="plS" min="5" max="400" value="100"><span id="plV">100%</span></div>
    <div class="pb"><button onclick="edCancelPlace()">취소</button><button class="go" onclick="edConfirmPlace()">확정</button></div>`;
  pn.querySelector('#plS').oninput=e=>{const P=ED.placing,c=cur().c;const cx=P.x+P.img.naturalWidth*P.scale/2,cy=P.y+P.img.naturalHeight*P.scale/2;
    P.scale=P.base*(+e.target.value/100);P.x=cx-P.img.naturalWidth*P.scale/2;P.y=cy-P.img.naturalHeight*P.scale/2;pn.querySelector('#plV').textContent=e.target.value+'%';edDrawPlace()};
}
function edDrawPlace(){const P=ED.placing,o=ED.ov,x=o.getContext('2d');x.clearRect(0,0,o.width,o.height);if(!P)return;
  const w=P.img.naturalWidth*P.scale,h=P.img.naturalHeight*P.scale;x.drawImage(P.img,P.x,P.y,w,h);x.setLineDash([10,6]);x.lineWidth=3;x.strokeStyle='#1E6BFF';x.strokeRect(P.x,P.y,w,h)}
function edBindOv(o){
  let drag=null;
  o.onpointerdown=e=>{if(!ED.placing)return;e.preventDefault();o.setPointerCapture(e.pointerId);const p=edPos(e,o);drag={sx:p.x,sy:p.y,ox:ED.placing.x,oy:ED.placing.y}};
  o.onpointermove=e=>{if(!drag)return;const p=edPos(e,o);ED.placing.x=drag.ox+p.x-drag.sx;ED.placing.y=drag.oy+p.y-drag.sy;edDrawPlace()};
  o.onpointerup=o.onpointercancel=()=>drag=null;
}
function edConfirmPlace(){const P=ED.placing;if(!P)return;edPush();cur().x.drawImage(P.img,P.x,P.y,P.img.naturalWidth*P.scale,P.img.naturalHeight*P.scale);edCancelPlace();edChanged()}
function edCancelPlace(){if(ED.placing){URL.revokeObjectURL(ED.placing.url);ED.placing=null}if(ED.ov){ED.ov.classList.remove('act');ED.ov.getContext('2d').clearRect(0,0,ED.ov.width,ED.ov.height)}edClosePanel()}

/* 컷 목록 */
function edRenderCuts(){
  const el=$('#edCuts');
  el.innerHTML=ED.cuts.map((c,i)=>`<div class="cutit ${i===ED.cur?'on':''} ${c.ink<CFG.minInk?'empty':''}" data-i="${i}"><img src="${c.thumb||''}"><span class="no">${i+1}</span>
    <div class="ops"><button data-op="up" title="위로">▲</button><button data-op="down" title="아래로">▼</button><button data-op="dup" title="복제">⧉</button><button data-op="del" title="삭제">✕</button></div></div>`).join('')
    +`<div class="addcut"><button onclick="edAddCut()">+ 컷 추가</button><select id="edCutSize">${CUT_SIZES.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>
    <div class="ed-help">최소 ${CFG.minCuts}컷 · 컷마다 그림이 있어야 해요</div>`;
  el.querySelectorAll('.cutit').forEach(d=>d.onclick=async e=>{
    const i=+d.dataset.i,op=e.target.dataset.op;
    if(op==='up'&&i>0){[ED.cuts[i-1],ED.cuts[i]]=[ED.cuts[i],ED.cuts[i-1]];ED.cur=i-1}
    else if(op==='down'&&i<ED.cuts.length-1){[ED.cuts[i+1],ED.cuts[i]]=[ED.cuts[i],ED.cuts[i+1]];ED.cur=i+1}
    else if(op==='dup'){const s=ED.cuts[i];const n=newCut(s.c.width,s.c.height);n.x.drawImage(s.c,0,0);n.ink=s.ink;n.thumb=s.thumb;ED.cuts.splice(i+1,0,n);ED.cur=i+1}
    else if(op==='del'){if(ED.cuts.length<2)return toast('컷이 하나는 있어야 해요');if(!await ask(`${i+1}번 컷을 삭제할까요?`,{ok:'삭제',danger:true}))return;ED.cuts.splice(i,1);ED.cur=Math.min(ED.cur,ED.cuts.length-1)}
    else if(!op){edSelect(i);return}
    ED.dirty=true;edSelect(ED.cur);edRenderCuts();edReq();
  });
}
function edAddCut(){const [w,h]=$('#edCutSize').value.split('x').map(Number);const n=newCut(w,h);edCalcInk(n);ED.cuts.splice(ED.cur+1,0,n);ED.dirty=true;edSelect(ED.cur+1);edRenderCuts();edReq();
  setTimeout(()=>{const a=document.querySelector('.cutit.on');a&&a.scrollIntoView({block:'nearest',inline:'nearest'})},30)}

/* 분량 조건 */
function edCheck(){
  const n=ED.cuts.length,empty=ED.cuts.map((c,i)=>c.ink<CFG.minInk?i+1:0).filter(Boolean);
  const okC=n>=CFG.minCuts,okE=!empty.length,okT=ED.seconds>=CFG.minSec;
  const msg=[];if(!okC)msg.push(`컷이 ${CFG.minCuts-n}개 더 필요해요`);if(!okE)msg.push(`${empty.join(', ')}번 컷이 비어 있어요`);if(!okT)msg.push(`작업 시간이 ${mmss(CFG.minSec-ED.seconds)} 더 필요해요`);
  return {okC,okE,okT,n,empty,ok:okC&&okE&&okT,msg:msg.join(' · ')};
}
function edReq(){
  const r=edCheck();
  $('#edReq').innerHTML=`<span class="${r.okC?'ok':'no'}">컷 ${r.n}/${CFG.minCuts}</span><span class="${r.okE?'ok':'no'}">${r.okE?'빈 컷 없음':'빈 컷 '+r.empty.length+'개'}</span><span class="${r.okT?'ok':'no'}">⏱ ${mmss(ED.seconds)}/${mmss(CFG.minSec)}</span>`;
}
setInterval(()=>{if(!ED.open||document.hidden)return;if(Date.now()-ED.lastAct<8000){ED.seconds++;edReq()}},1000);
setInterval(()=>{if(ED.open&&ED.dirty&&!ED.busy)edSaveDraft(false)},30000);

async function edSaveDraft(show){
  try{
    const cuts=[];for(const c of ED.cuts){cuts.push({w:c.c.width,h:c.c.height,blob:await new Promise(r=>c.c.toBlob(r,'image/png'))})}
    await IDB.set(draftKey(),{cuts,seconds:ED.seconds,title:$('#edTitle').value,note:ED.note,savedAt:new Date().toISOString()});
    ED.dirty=false;if(show)toast('이 기기에 임시저장했어요');
  }catch(e){console.error(e);if(show)toast('임시저장에 실패했어요')}
}
function edNote(){
  const m=modal(`<div class="mh"><h2>작가의 말</h2><button class="x" data-close>×</button></div><div class="mb"><textarea class="fi" id="enT" maxlength="300" placeholder="독자에게 한마디">${esc(ED.note)}</textarea></div>
    <div class="mf"><button class="btn btn-p" id="enGo">저장</button></div>`);
  m.style.zIndex=400;m.querySelector('#enGo').onclick=()=>{ED.note=m.querySelector('#enT').value.trim();ED.dirty=true;m._close()};
}
async function edClose(){
  if(ED.busy)return;
  if(ED.dirty){
    const v=await choose('그리던 내용을 어떻게 할까요?',[{t:'계속 그리기',v:'stay'},{t:'저장 안 하고 나가기',v:'drop',cls:'btn-ro'},{t:'임시저장하고 나가기',v:'save',cls:'btn-p'}]);
    if(!v||v==='stay')return;if(v==='save')await edSaveDraft(true);
  }
  edCancelPlace();ED.open=false;ED.cuts=[];ED.undo=[];ED.redo=[];$('#editor').hidden=true;document.body.style.overflow='';$('#edCW').innerHTML='';
}
async function edSubmit(){
  if(ED.busy)return;
  ED.cuts.forEach(edCalcInk);edRenderCuts();edReq();
  const r=edCheck();if(!r.ok)return toast('아직 올릴 수 없어요: '+r.msg,3500);
  const title=$('#edTitle').value.trim();if(!title){$('#edTitle').focus();return toast('회차 제목을 적어 주세요')}
  if(!await ask(`「${title}」 ${ED.cuts.length}컷을 운영자에게 승인 요청할까요?`,{ok:'승인 요청'}))return;
  ED.busy=true;const btn=$('#edSubmit');btn.disabled=true;
  const uploaded=[];
  try{
    const base=`${ME.id}/${ED.work.id}/${Date.now()}`;
    for(let i=0;i<ED.cuts.length;i++){btn.textContent=`업로드 ${i+1}/${ED.cuts.length}`;uploaded.push(await uploadCanvas(ED.cuts[i].c,`${base}_${String(i+1).padStart(2,'0')}`,0.85))}
    const tc=ED.cuts[0].c,th=document.createElement('canvas');th.width=400;th.height=250;
    const tx=th.getContext('2d'),s=Math.max(400/tc.width,250/tc.height);tx.drawImage(tc,(400-tc.width*s)/2,(250-tc.height*s)/2,tc.width*s,tc.height*s);
    const thumb=await uploadCanvas(th,`${base}_thumb`,0.8);uploaded.push(thumb);
    const row={title,author_note:ED.note,pages:uploaded.slice(0,-1),thumb_path:thumb,draw_seconds:ED.seconds};
    if(ED.editEp){
      const {error}=await sb.from('episodes').update(row).eq('id',ED.editEp.id);if(error)throw error;
      await removeFiles([...ED.editEp.pages,ED.editEp.thumb_path]);
    }else{
      const {data:mx}=await sb.from('episodes').select('no').eq('work_id',ED.work.id).order('no',{ascending:false}).limit(1);
      const no=mx&&mx.length?mx[0].no+1:1;
      const {error}=await sb.from('episodes').insert({...row,work_id:ED.work.id,no});if(error)throw error;
    }
    await IDB.del(draftKey()).catch(()=>{});
    ED.dirty=false;ED.busy=false;btn.disabled=false;btn.textContent='승인 요청';
    await edClose();C.works=null;
    toast(isAdmin()?'회차를 올렸어요 (운영자는 바로 공개돼요)':'승인 요청을 보냈어요! 승인되면 알림으로 알려드려요',3500);
    S.myTab='mine';go(isAdmin()?'work-'+ED.work.id:'my');
  }catch(e){
    console.error(e);await removeFiles(uploaded).catch(()=>{});
    toast('올리지 못했어요: '+errMsg(e),4000);ED.busy=false;btn.disabled=false;btn.textContent='승인 요청';
  }
}
window.addEventListener('beforeunload',e=>{if(ED.open&&ED.dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(!ED.open||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?edRedo():edUndo()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();edRedo()}
  else if(!e.ctrlKey&&!e.metaKey){const k={b:'pen',m:'marker',e:'eraser',g:'fill',l:'line',t:'text',f:'fx'}[e.key.toLowerCase()];if(k)edTool(k)}});

/* ================= 시작 ================= */
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));
let _authReady=false;
sb.auth.onAuthStateChange((ev,session)=>{
  const was=ME&&ME.id;ME=session?session.user:null;
  if(!_authReady)return;
  if((ME&&ME.id)!==was){
    setTimeout(async()=>{await loadProfile();paintAuth();refreshPendingCount();checkNotices();route()},0);
  }
});
(async()=>{
  const {data}=await sb.auth.getSession();ME=data.session?data.session.user:null;
  await loadProfile();paintAuth();_authReady=true;
  route();refreshPendingCount();checkNotices();
})();
</script>
