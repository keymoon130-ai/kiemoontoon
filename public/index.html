<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>최기문웹툰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Jua&family=Do+Hyeon&family=Black+Han+Sans&family=Nanum+Pen+Script&family=Gaegu:wght@700&family=Gamja+Flower&family=East+Sea+Dokdo&family=Yeon+Sung&family=Nanum+Myeongjo:wght@700&family=Hi+Melody&family=Dongle:wght@700&family=Sunflower:wght@700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#1E6BFF; --blue-d:#1556D6; --blue-l:#EAF1FF;
  --ink:#1a1a1a; --sub:#6b6f76; --line:#e6e8eb; --bg:#fff; --soft:#f6f7f9;
  --red:#ff4d4f; --red-l:#fff1f0; --org:#fa8c16; --grn:#22a06b;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:default;opacity:.45}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:18px;height:60px}
.logo{font-weight:900;font-size:22px;color:var(--blue);letter-spacing:-1px;white-space:nowrap;cursor:pointer}
.logo span{color:var(--ink)}
.nav{display:flex;gap:4px}
.nav button{padding:8px 12px;font-weight:700;font-size:15px;color:var(--sub);border-radius:8px;position:relative}
.nav button.on{color:var(--ink)}
.nav button:hover{background:var(--soft)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;background:var(--soft);border-radius:20px;padding:0 12px;height:36px}
.search input{border:none;background:none;outline:none;width:160px;font-size:14px}
.btn{height:36px;padding:0 14px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover:not(:disabled){background:var(--blue-d)}
.btn-o{border:1px solid var(--line);background:#fff}
.btn-o:hover:not(:disabled){background:var(--soft)}
.btn-r{background:var(--red);color:#fff}
.btn-ro{border:1px solid #ffccc7;color:#cf1322;background:#fff}
.btn-g{background:var(--grn);color:#fff}
.cnt-badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:900;padding:0 5px;margin-left:4px;text-align:center}
.banbar{background:#cf1322;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:8px}

.banner{position:relative;height:260px;border-radius:14px;overflow:hidden;margin:20px 0 6px;background:var(--soft)}
.slide{position:absolute;inset:0;display:flex;align-items:flex-end;padding:28px;color:#fff;opacity:0;transition:opacity .6s;cursor:pointer;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(18px) brightness(.75);transform:scale(1.2)}
.slide .fg{position:absolute;right:40px;top:20px;bottom:20px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.slide .fg img,.slide .fg svg{width:100%;height:100%;object-fit:cover;display:block}
.slide .txt{position:relative;z-index:1;max-width:60%}
.slide .tag{display:inline-block;background:var(--blue);padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700;margin-bottom:8px}
.slide h2{font-size:30px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.slide p{font-size:15px;opacity:.95;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.slide.welcome{background:linear-gradient(120deg,#1E6BFF,#7aa7ff)}
.dots{position:absolute;right:20px;bottom:18px;display:flex;gap:6px;z-index:2}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots i.on{background:#fff;width:20px;border-radius:4px}

.days{display:flex;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto;scrollbar-width:none}
.days button{flex:1;min-width:58px;padding:14px 0;font-weight:700;font-size:15px;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1px}
.days button.on{color:var(--blue);border-color:var(--blue)}
.sortbar{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.sortbar .cnt{font-size:14px;color:var(--sub)}
.sorts button{font-size:13px;color:var(--sub);padding:4px 8px}
.sorts button.on{color:var(--ink);font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px;padding-bottom:30px}
.card{cursor:pointer}
.thumb{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--soft)}
.thumb img,.thumb svg{width:100%;height:100%;display:block;object-fit:cover;transition:transform .3s}
.card:hover .thumb img,.card:hover .thumb svg{transform:scale(1.04)}
.badges{position:absolute;top:6px;left:6px;display:flex;gap:4px}
.srow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.srow .sn{flex:1;min-width:0;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sn small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.srow select{height:32px;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:13px}
.srow .from{font-size:13px;color:var(--sub)}
.sply{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;flex-shrink:0}
.bgm-tip{font-size:13px;color:var(--sub);line-height:1.6;margin:0 0 10px}
.bgm-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.bgm-modes button{border:2px solid var(--line);border-radius:10px;padding:10px 8px;text-align:left;background:#fff}
.bgm-modes button b{display:block;font-size:14px}.bgm-modes button span{font-size:11.5px;color:var(--sub)}
.bgm-modes button.on{border-color:var(--blue);background:#f0f5ff}
.cv-cmp{display:flex;align-items:center;gap:14px;justify-content:center}.cv-cmp small{display:block;text-align:center;font-size:12px;color:var(--sub);margin-bottom:4px}
.cv-cmp .cvp{width:120px;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub)}
.cv-cmp .cvp img,.cv-cmp .cvp canvas,.cv-cmp .cvp svg{width:100%;height:100%;object-fit:cover;display:block}
.cv-cmp.sm{gap:6px;flex:none}.cv-cmp.sm .cvp{width:54px}
.ro-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ro-it{position:relative;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft);cursor:grab}
.ro-it img{width:100%;height:150px;object-fit:cover;object-position:top;display:block;pointer-events:none}
.ro-it>b{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:1px 7px;border-radius:4px}
.ro-it.chg{border-color:var(--org)}.ro-it.over{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,107,255,.25)}.ro-it.drag{opacity:.4}
.ro-b{display:flex}.ro-b button{flex:1;padding:6px 0;font-size:13px;background:#fff;border-top:1px solid var(--line)}.ro-b button+button{border-left:1px solid var(--line)}.ro-b button:disabled{opacity:.3}
.ed-sst{font-size:11px;color:#9ab;white-space:nowrap}.ed-sst.warn{color:#ffb74d}.ed-sst.err{color:#ff6b6b}
.dr-row .thumb.mini{width:64px;height:84px}.dr-row .thumb.mini img{object-fit:cover;object-position:top}
.shp-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px;font-size:12px;color:#cfd3da}
.shp-row button{min-width:34px;padding:5px 8px;border-radius:6px;background:#383a40;color:#fff;font-size:13px}.shp-row button.on{background:var(--blue)}
.shp-row label{display:flex;align-items:center;gap:4px;margin-left:6px}.shp-row input[type=color]{width:30px;height:24px;border:0;padding:0;background:none}.shp-row input[type=range]{width:80px}
.ubar{height:8px;background:#eee;border-radius:4px;margin-top:14px;overflow:hidden}.ubar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
#edBgmBtn.on{background:#1f3f8f;color:#fff}
.bgm-box{position:fixed;right:16px;bottom:20px;z-index:60;display:flex;align-items:center;gap:8px;background:rgba(20,20,20,.92);color:#fff;border-radius:999px;padding:6px;box-shadow:0 4px 18px rgba(0,0,0,.3);font-size:13px;max-width:calc(100vw - 32px)}
.bgm-box .bgm-on{color:#fff;font-weight:900;padding:8px 16px;font-size:14px}
.bgm-box.playing{padding:6px 6px 6px 14px}
.bgm-box .bt{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.bgm-box input{width:70px}.bgm-box button{color:#fff;padding:6px 10px;border-radius:999px;background:#333;font-size:12px}
.bgm-box .eq{display:flex;gap:2px;align-items:flex-end;height:14px}.bgm-box .eq i{width:3px;background:#5aa0ff;animation:eq .8s infinite alternate}
.bgm-box .eq i:nth-child(2){animation-delay:.25s}.bgm-box .eq i:nth-child(3){animation-delay:.5s}.bgm-box .eq.mute i{animation:none;height:3px;background:#777}
@keyframes eq{from{height:3px}to{height:14px}}
@media(max-width:600px){.bgm-modes{grid-template-columns:1fr}.bgm-box .bt{max-width:90px}.bgm-box input{width:54px}}
.bdg{font-size:10px;font-weight:900;padding:2px 5px;border-radius:3px;color:#fff;display:inline-block;vertical-align:middle}
.bdg.up{background:var(--red)}.bdg.new{background:var(--blue)}.bdg.end{background:#333}
.bdg.pend{background:var(--org)}.bdg.rej{background:#cf1322}.bdg.ok{background:var(--grn)}
.card h3{font-size:15px;font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .au{font-size:13px;color:var(--sub);margin-top:2px}
.card .st{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:8px}
.star{color:var(--blue);font-weight:700}
.sec-t{font-size:20px;font-weight:900;margin:28px 0 14px;display:flex;align-items:center;gap:8px}
.sec-t small{font-size:13px;color:var(--sub);font-weight:500}
.empty{text-align:center;color:var(--sub);padding:60px 0;font-size:15px;line-height:1.7}
.loading{text-align:center;color:var(--sub);padding:80px 0}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

.dt{display:flex;gap:28px;padding:30px 0;border-bottom:1px solid var(--line)}
.dt .thumb{width:220px;flex:none}
.dt-info{flex:1;min-width:0}
.dt-info h1{font-size:28px;font-weight:900;word-break:keep-all}
.dt-info .au{color:var(--sub);margin:6px 0 2px;font-size:15px}
.dt-info .meta{font-size:14px;color:var(--sub);margin-bottom:14px}
.dt-info .desc{font-size:15px;line-height:1.7;color:#333;max-width:560px;white-space:pre-wrap}
.chips{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.chip{font-size:12px;background:var(--blue-l);color:var(--blue);padding:4px 10px;border-radius:12px;font-weight:700}
.dt-btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.dt-btns .btn{height:44px;padding:0 20px;font-size:15px}
.fav.on{background:var(--blue-l);color:var(--blue);border-color:var(--blue)}
.note{border-radius:8px;padding:12px 14px;font-size:14px;margin-top:14px;line-height:1.6}
.note.warn{background:#fff7e6;border:1px solid #ffd591;color:#ad4e00}
.note.bad{background:var(--red-l);border:1px solid #ffccc7;color:#cf1322}
.note.info{background:var(--blue-l);border:1px solid #c6d8ff;color:#1546a8}
.ep-head{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.ep{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ep:hover{background:var(--soft)}
.ep .et{width:120px;aspect-ratio:16/10;border-radius:6px;overflow:hidden;flex:none;background:var(--soft)}
.ep .et img{width:100%;height:100%;object-fit:cover;display:block}
.ep .en{font-size:15px;font-weight:500}
.ep .ei{font-size:13px;color:var(--sub);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.ep.read .en{color:#aaa}
.ep .acts{margin-left:auto;display:flex;gap:6px}
.sm{font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:700}
.sm.red{color:#cf1322;border-color:#ffccc7}
.sm.blue{color:var(--blue);border-color:#c6d8ff}

.viewer{background:#111;min-height:100vh}
.vbar{position:sticky;top:0;z-index:40;background:rgba(17,17,17,.96);color:#fff;display:flex;align-items:center;height:54px;padding:0 16px;gap:12px;border-bottom:1px solid #2a2a2a}
.vbar .vt{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar button{color:#fff;font-size:14px;padding:6px 10px;border-radius:6px;white-space:nowrap}
.vbar button:hover:not(:disabled){background:#2a2a2a}
.vbar .sp{margin-left:auto;display:flex;gap:4px}
.panels{max-width:min(100%,calc(720px * var(--vz,1)));margin:0 auto;background:#fff;min-height:200px}
.vzoom{display:flex;align-items:center;gap:2px;margin-right:6px}.vzoom b{font-size:12px;min-width:40px;text-align:center;color:#ccc}
@media(max-width:760px){.vzoom{display:none}}
.panels img{display:block;width:100%;height:auto}
.vend{text-align:center;padding:40px 0;font-weight:900;font-size:22px;background:#fff}
.vfoot{max-width:720px;margin:0 auto;background:#fff;padding:24px 20px 60px}
.awords{background:var(--soft);border-radius:10px;padding:16px;font-size:14px;line-height:1.6;color:#444;white-space:pre-wrap}
.awords b{display:block;margin-bottom:4px;color:var(--ink)}
.rate{text-align:center;padding:26px 0;border-bottom:1px solid var(--line)}
.rate .stars{font-size:30px;letter-spacing:2px;color:#ddd;user-select:none}
.rate .stars span{cursor:pointer}
.rate .stars span.on{color:var(--blue)}
.rate .rv{font-size:14px;color:var(--sub);margin-top:6px}
.navep{display:flex;gap:8px;margin:20px 0}
.navep button{flex:1;height:46px;border:1px solid var(--line);border-radius:8px;font-weight:700}
.navep .mid{flex:0 0 90px}
.cmt-w{display:flex;gap:8px;margin:16px 0}
.cmt-w textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;resize:none;height:64px;font-size:14px;outline:none}
.cmt-w textarea:focus{border-color:var(--blue)}
.cmt-w .btn{height:64px}
.cmt{padding:14px 0;border-bottom:1px solid var(--line)}
.cmt .awr{font-size:10px;background:#111;color:#fff;padding:1px 5px;border-radius:3px;font-weight:900}
.cmt.gone p{color:var(--sub);font-size:14px;margin:0 0 4px}
.reps{margin:10px 0 0 18px;padding-left:12px;border-left:2px solid var(--line)}
.cmt.rep{padding:10px 0;border-bottom:1px dashed var(--line)}.cmt.rep:last-of-type{border-bottom:0}
.cmt-w.rw{margin:10px 0 4px}.cmt-w.rw textarea{height:48px}.cmt-w.rw .btn{height:48px}
.ca .rbtn.on{color:var(--blue);font-weight:700}
.cmt .cn{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.cmt .cn .best{font-size:10px;background:var(--blue);color:#fff;padding:1px 5px;border-radius:3px}
.cmt .cn .dd{font-weight:400;color:var(--sub);font-size:12px}
.cmt p{font-size:14px;margin:6px 0;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.cmt .ca{display:flex;gap:10px;font-size:12px;color:var(--sub)}
.cmt .ca button{font-size:12px;color:var(--sub);border:1px solid var(--line);padding:3px 8px;border-radius:4px}
.cmt .ca button.on{color:var(--blue);border-color:var(--blue)}
.cmt .ca .del{color:var(--red);border-color:#ffd0d0;margin-left:auto}

.rk{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rk:hover{background:var(--soft)}
.rk .n{width:30px;text-align:center;font-size:22px;font-weight:900;color:var(--sub);flex:none}
.rk .n.top{color:var(--blue)}
.rk .thumb{width:70px;flex:none}
.rk h3{font-size:16px;font-weight:700}
.rk .au{font-size:13px;color:var(--sub);margin-top:3px}
.pills{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.pills button{padding:8px 14px;border-radius:20px;border:1px solid var(--line);font-size:14px;font-weight:500}
.pills button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.prof{display:flex;align-items:center;gap:16px;padding:26px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ava{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;flex:none}
.prof h2{font-size:20px}
.prof p{font-size:14px;color:var(--sub);margin-top:2px}
.role{font-size:11px;font-weight:900;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}
.role.reader{background:var(--soft);color:var(--sub)}.role.author{background:var(--blue-l);color:var(--blue)}.role.admin{background:#fff1f0;color:#cf1322}
.subtabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:6px;overflow-x:auto;scrollbar-width:none}
.subtabs button{padding:14px 0;font-weight:700;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs button.on{color:var(--ink);border-color:var(--ink)}
.box{border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:18px}
.box h3{font-size:16px;margin-bottom:6px}
.box p.d{font-size:14px;color:var(--sub);line-height:1.6}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;font-size:15px}
.row .s{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}
.row .mini{width:54px;flex:none}
.notice{padding:14px 0;border-bottom:1px solid var(--line)}
.notice .nt{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.notice .nm{font-size:14px;color:#444;margin-top:4px;white-space:pre-wrap}
.notice .nd{font-size:12px;color:var(--sub);margin-top:4px}
.notice.unseen{background:#f7faff}

.mroot .mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.modal.wide{max-width:780px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.mh h2{font-size:18px}
.mh .x{font-size:24px;color:var(--sub);line-height:1}
.mb{padding:20px 22px}
.mf{padding:14px 22px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mf .btn{height:42px;padding:0 20px}
.mtabs{display:flex;background:var(--soft);border-radius:8px;padding:4px;margin-bottom:18px}
.mtabs button{flex:1;padding:9px;border-radius:6px;font-weight:700;font-size:14px;color:var(--sub)}
.mtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fl{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.fl:first-child{margin-top:0}
.fl small{font-weight:400;color:var(--sub)}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms||2200)}
function fmt(n){n=n||0;return n>=10000?(n/10000).toFixed(1)+'만':n.toLocaleString()}

function dstr(t){if(!t)return'';const d=new Date(t);return `${String(d.getFullYear()).slice(2)}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
function ago(t){const s=(Date.now()-new Date(t))/1000;if(s<60)return'방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';if(s<86400*7)return Math.floor(s/86400)+'일 전';return dstr(t)}
function pub(p){return p?`${CFG.url}/storage/v1/object/public/${CFG.bucket}/${p.split('/').map(encodeURIComponent).join('/')}`:''}
function mmss(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function idEmail(id){return 'u'+[...new TextEncoder().encode(id)].map(b=>b.toString(16).padStart(2,'0')).join('')+'@'+CFG.domain}
function errMsg(e){const m=(e&&(e.message||e.error_description))||String(e);
  if(/Invalid login/i.test(m))return'아이디 또는 비밀번호가 틀렸어요';
  if(/already registered|already been registered/i.test(m))return'이미 있는 아이디예요';
  if(/row-level security/i.test(m))return'권한이 없어요 (정지 상태이거나 작가가 아니에요)';
  if(/Password should be/i.test(m))return'비밀번호는 6자 이상이어야 해요';
  if(/Failed to fetch/i.test(m))return'인터넷 연결을 확인해 주세요';
  return m}
const isAdmin=()=>PROF&&PROF.role==='admin';
const isAuthor=()=>PROF&&(PROF.role==='author'||PROF.role==='admin');
function banned(p){p=p||PROF;return !!p&&(p.perma_ban||(p.banned_until&&new Date(p.banned_until)>new Date()))}
function banText(p){p=p||PROF;return p.perma_ban?'영구 정지':`${new Date(p.banned_until).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}까지 정지`}
function loadingHTML(t){return `<div class="loading"><div class="spin"></div>${t||'불러오는 중…'}</div>`}
function hue(id){return (Number(id)*67)%360}
function fbThumb(w){const h=hue(w.id);return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice"><rect width="300" height="400" fill="hsl(${h},60%,62%)"/><text x="150" y="210" text-anchor="middle" font-size="30" font-weight="900" fill="#fff" font-family="Noto Sans KR">${esc((w.title||'').slice(0,9))}</text></svg>`}
function thumbHTML(w){return w.thumb_path?`<img src="${pub(w.thumb_path)}" loading="lazy" alt="">`:fbThumb(w)}
function authorName(w){return w.profiles?(w.profiles.pen_name||w.profiles.display_name):''}
function penOf(p){return p?(p.pen_name||p.display_name):''}
function isUp(w){return w.last_episode_at&&Date.now()-new Date(w.last_episode_at)<72*3600e3}
function isNew(w){return Date.now()-new Date(w.created_at)<14*86400e3}

/* ================= 모달 ================= */
function modal(html,{wide,onClose}={}){
  const bg=document.createElement('div');bg.className='mbg';
  bg.innerHTML=`<div class="modal ${wide?'wide':''}">${html}</div>`;
  bg.addEventListener('mousedown',e=>{if(e.target===bg){bg._close()}});
  bg._close=()=>{bg.remove();onClose&&onClose()};
  bg.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>bg._close());
  $('#mroot').appendChild(bg);return bg;
}
function ask(msg,{ok='확인',cancel='취소',danger}={}){
  return new Promise(res=>{const m=modal(`<div class="mb" style="padding-top:26px;font-size:15px;line-height:1.6;white-space:pre-wrap">${esc(msg)}</div>
    <div class="mf">${cancel?`<button class="btn btn-o" data-v="0">${cancel}</button>`:''}<button class="btn ${danger?'btn-r':'btn-p'}" data-v="1">${ok}</button></div>`,{onClose:()=>res(false)});
    m.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{m.remove();res(b.dataset.v==='1')});});
}
function askType(msg,word,{ok='삭제',warn}={}){
  return new Promise(res=>{const m=modal(`<div class="mb" style="padding-top:26px;font-size:15px;line-height:1.6">
    ${warn?`<div class="note bad" style="margin:0 0 12px">${esc(warn)}</div>`:''}
    <div style="white-space:pre-wrap">${esc(msg)}</div>
    <div style="margin-top:14px;font-size:13px;color:#666">확인을 위해 아래에 <b style="color:#cf1322;user-select:none">${esc(word)}</b> 을(를) 똑같이 입력해 주세요.</div>
    <input id="atIn" autocomplete="off" style="width:100%;margin-top:8px;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:15px" placeholder="${esc(word)}"></div>
    <div class="mf"><button class="btn btn-o" data-v="0">취소</button><button class="btn btn-r" data-v="1" disabled style="opacity:.4">${ok}</button></div>`,{onClose:()=>res(false)});
    const inp=m.querySelector('#atIn'),b=m.querySelector('[data-v="1"]');
    const chk=()=>{const okk=inp.value.trim()===String(word).trim();b.disabled=!okk;b.style.opacity=okk?1:.4};
    inp.addEventListener('input',chk);inp.addEventListener('paste',e=>e.preventDefault());
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!b.disabled)b.click()});
    setTimeout(()=>inp.focus(),30);
    m.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{if(x.disabled)return;m.remove();res(x.dataset.v==='1')});});
}
function choose(msg,btns){
  return new Promise(res=>{const m=modal(`<div class="mb" style="padding-top:26px;font-size:15px;line-height:1.6">${esc(msg)}</div>
    <div class="mf">${btns.map((b,i)=>`<button class="btn ${b.cls||'btn-o'}" data-i="${i}">${b.t}</button>`).join('')}</div>`,{onClose:()=>res(null)});
    m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{m.remove();res(btns[+b.dataset.i].v)});});
}

/* ================= 라우터 ================= */
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h}
window.addEventListener('hashchange',route);
async function route(){
  const h=location.hash.slice(1)||'home';
  const [p,arg]=h.split(/-(.*)/s);
  document.body.classList.toggle('vmode',p==='view');
  {const vm=document.querySelector('meta[name=viewport]');if(vm)vm.content=p==='view'?'width=device-width, initial-scale=1':'width=device-width, initial-scale=1, maximum-scale=1'}
  $('#hdr').hidden=p==='view';$('#ftr').hidden=p==='view';
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===p));
  window.scrollTo(0,0);bgmStop();prevStop();
  try{
    if(p==='work')await pageWork(+arg);
    else if(p==='view')await pageView(+arg);
    else if(p==='ranking')await pageRanking();
    else if(p==='my')await pageMy();
    else if(p==='admin')await pageAdmin();
    else if(p==='search')await pageSearch();
    else await pageHome();
  }catch(e){console.error(e);app.innerHTML=`<div class="wrap"><div class="empty">문제가 생겼어요 😢<br><small>${esc(errMsg(e))}</small><br><br><button class="btn btn-o" onclick="route()">다시 시도</button></div></div>`}
}
function refresh(){route()}

function openLogin(tab){
  const m=modal(`<div class="mh"><h2>최기문웹툰</h2><button class="x" data-close>×</button></div>
  <div class="mb"><div class="mtabs"><button data-t="in">로그인</button><button data-t="up">회원가입</button></div>
    <label class="fl">아이디 <small>(한글·영문·숫자 2~16자)</small></label><input class="fi" id="lgId" autocomplete="username" maxlength="16">
    <label class="fl">비밀번호</label><input class="fi" id="lgPw" type="password" autocomplete="current-password">
    <div id="lgPw2w" hidden><label class="fl">비밀번호 확인</label><input class="fi" id="lgPw2" type="password" autocomplete="new-password"></div>
    <div class="err" id="lgErr"></div></div>
  <div class="mf"><button class="btn btn-p" style="width:100%" id="lgGo">로그인</button></div>`);
  let mode=tab||'in';
  const set=t=>{mode=t;m.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));m.querySelector('#lgPw2w').hidden=t!=='up';m.querySelector('#lgGo').textContent=t==='up'?'가입하기':'로그인';m.querySelector('#lgErr').textContent=''};
  m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>set(b.dataset.t));set(mode);
  const submit=async()=>{
    const id=m.querySelector('#lgId').value.trim().toLowerCase(),pw=m.querySelector('#lgPw').value,er=m.querySelector('#lgErr'),btn=m.querySelector('#lgGo');
    er.textContent='';
    if(!/^[a-z0-9가-힣_]{2,16}$/.test(id)){er.textContent='아이디는 한글·영문·숫자·_ 2~16자로 해 주세요';return}
    if(new TextEncoder().encode(id).length>30){er.textContent='아이디가 너무 길어요 (한글은 10자까지)';return}
    if(pw.length<6){er.textContent='비밀번호는 6자 이상이어야 해요';return}
    btn.disabled=true;
    try{
      if(mode==='up'){
        if(pw!==m.querySelector('#lgPw2').value){er.textContent='비밀번호가 서로 달라요';btn.disabled=false;return}
        const {data:ex}=await sb.from('profiles').select('id').eq('username',id).maybeSingle();
        if(ex){er.textContent='이미 있는 아이디예요';btn.disabled=false;return}
        const {data,error}=await sb.auth.signUp({email:idEmail(id),password:pw,options:{data:{username:id}}});
        if(error)throw error;
        if(!data.session){er.textContent='가입은 됐는데 자동 로그인이 안 됐어요. Supabase에서 Confirm email이 꺼져 있는지 확인해 주세요.';btn.disabled=false;return}
        toast(`환영해요, ${id} 님!`);
      }else{
        const {error}=await sb.auth.signInWithPassword({email:idEmail(id),password:pw});
        if(error)throw error;
        toast('로그인했어요');
      }
      m._close();
    }catch(e){er.textContent=errMsg(e);btn.disabled=false}
  };
  m.querySelector('#lgGo').onclick=submit;
  m.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')submit()});
  setTimeout(()=>m.querySelector('#lgId').focus(),50);
}
async function logout(){if(!await ask('로그아웃할까요?'))return;await sb.auth.signOut();toast('로그아웃했어요');go('home')}
function needLogin(){if(!ME){openLogin();return true}return false}
function needAct(){if(needLogin())return true;if(banned()){toast(`${banText()} 상태라 할 수 없어요`);return true}return false}

async function getWorks(force){
  if(!force&&C.works&&Date.now()-C.worksAt<20000)return C.works;
  const {data,error}=await sb.from('works').select('*, profiles!works_author_id_fkey(display_name,pen_name,username)').eq('status','approved').order('created_at',{ascending:false});
  if(error)throw error;C.works=data;C.worksAt=Date.now();return data;
}
function recentGet(){try{return JSON.parse(localStorage.getItem('kmt_recent')||'[]')}catch(e){return[]}}
function recentAdd(r){try{const l=recentGet().filter(x=>x.w!==r.w);l.unshift(r);localStorage.setItem('kmt_recent',JSON.stringify(l.slice(0,20)))}catch(e){}}
function readGet(){try{return new Set(JSON.parse(localStorage.getItem('kmt_read')||'[]'))}catch(e){return new Set()}}
function readAdd(id){try{const s=readGet();s.add(id);localStorage.setItem('kmt_read',JSON.stringify([...s].slice(-2000)))}catch(e){}}

/* ================= 홈 ================= */
async function pageHome(){
  if(!C.works)app.innerHTML=loadingHTML();
  const all=await getWorks();
  const top=[...all].sort((a,b)=>b.views-a.views).slice(0,4);
  let list;
  if(S.day==='완결')list=all.filter(w=>w.finished);
  else if(S.day==='신작')list=all.filter(isNew);
  else if(S.day==='자유')list=all.filter(w=>!w.days.length);
  else list=all.filter(w=>w.days.includes(S.day));
  if(S.sort==='pop')list.sort((a,b)=>b.views-a.views);
  if(S.sort==='rate')list.sort((a,b)=>(b.rating_count?b.rating_sum/b.rating_count:0)-(a.rating_count?a.rating_sum/a.rating_count:0));
  if(S.sort==='up')list.sort((a,b)=>new Date(b.last_episode_at||0)-new Date(a.last_episode_at||0));
  S.bannerI=0;
  const tabs=[...DAYS,'자유','신작','완결'];
  const banner=top.length?top.map((w,i)=>`<div class="slide ${i===0?'on':''}" onclick="go('work-${w.id}')">${w.thumb_path?`<img class="bgimg" src="${pub(w.thumb_path)}">`:`<div class="bgimg" style="background:hsl(${hue(w.id)},60%,55%)"></div>`}
      <div class="fg">${thumbHTML(w)}</div><div class="txt"><span class="tag">${['오늘의 인기','친구 추천','화제작','급상승'][i]}</span><h2>${esc(w.title)}</h2><p>${esc(w.description.slice(0,40))}${w.description.length>40?'…':''}</p></div></div>`).join('')
    :`<div class="slide on welcome" onclick="startUpload()"><div class="txt"><span class="tag" style="background:#fff;color:var(--blue)">오픈!</span><h2>최기문웹툰에 오신 걸 환영해요</h2><p>작가 신청하고 첫 번째 웹툰의 주인공이 되어보세요 ✏️</p></div></div>`;
  app.innerHTML=`<div class="wrap">
    <div class="banner" id="banner">${banner}${top.length>1?`<div class="dots">${top.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}</div>
    <div class="days">${tabs.map(d=>`<button class="${d===S.day?'on':''}" onclick="S.day='${d}';pageHome()">${d}${d===TODAY?'<small style="font-size:9px;margin-left:2px;vertical-align:top">●</small>':''}</button>`).join('')}</div>
    <div class="sortbar"><span class="cnt">전체 ${list.length}</span>
      <div class="sorts">${[['pop','인기순'],['up','업데이트순'],['rate','별점순']].map(([k,v])=>`<button class="${S.sort===k?'on':''}" onclick="S.sort='${k}';pageHome()">${v}</button>`).join('·')}</div></div>
    <div class="grid">${list.map(cardHTML).join('')||`<div class="empty" style="grid-column:1/-1">${S.day==='자유'?'자유연재':S.day}${DAYS.includes(S.day)?'요일에는':'에는'} 아직 작품이 없어요.</div>`}</div>
    ${all.length?`<div class="sec-t">🔥 지금 친구들이 많이 찜한 웹툰</div><div class="grid">${[...all].sort((a,b)=>b.fav_count-a.fav_count).slice(0,6).map(cardHTML).join('')}</div>`:''}
  </div>`;
}
setInterval(()=>{const sl=document.querySelectorAll('#banner .slide');if(sl.length<2)return;S.bannerI=(S.bannerI+1)%sl.length;
  sl.forEach((s,i)=>s.classList.toggle('on',i===S.bannerI));document.querySelectorAll('#banner .dots i').forEach((s,i)=>s.classList.toggle('on',i===S.bannerI))},4500);

const CM={open:new Set(),reply:null,author:null};
async function loadComments(epId,authorId){
  if(authorId!==undefined)CM.author=authorId;
  const {data:cs,error}=await sb.from('comments').select('*, profiles!comments_user_id_fkey(display_name,username)').eq('episode_id',epId).order('created_at',{ascending:false}).limit(500);
  if(error){$('#cmtArea').innerHTML='';return}
  const tops=cs.filter(c=>!c.parent_id),reps={};
  cs.filter(c=>c.parent_id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(c=>(reps[c.parent_id]=reps[c.parent_id]||[]).push(c));
  let liked=new Set();
  if(ME&&cs.length){const {data:l}=await sb.from('comment_likes').select('comment_id').eq('user_id',ME.id).in('comment_id',cs.map(c=>c.id));liked=new Set((l||[]).map(x=>x.comment_id))}
  const best=tops.filter(c=>!c.deleted&&c.like_count>=3).sort((a,b)=>b.like_count-a.like_count).slice(0,3);
  const bestIds=new Set(best.map(c=>c.id));
  const rest=tops.filter(c=>!bestIds.has(c.id));
  const total=cs.filter(c=>!c.deleted).length;
  const canW=ME&&!banned();
  const name=c=>`${esc(c.profiles?c.profiles.display_name:'?')}${c.user_id===CM.author?'<span class="awr">작가</span>':''}`;
  const acts=(c)=>`<button class="${liked.has(c.id)?'on':''}" onclick="likeCmt(${c.id},${liked.has(c.id)},${epId})">👍 ${c.like_count}</button>${ME&&(c.user_id===ME.id||isAdmin())?`<button class="del" onclick="delCmt(${c.id},${epId})">삭제</button>`:''}`;
  const rep=c=>`<div class="cmt rep"><div class="cn">↳ ${name(c)}<span class="dd">${ago(c.created_at)}</span></div><p>${esc(c.body)}</p><div class="ca">${acts(c)}</div></div>`;
  const one=(c,b)=>{
    const rs=reps[c.id]||[],open=CM.open.has(c.id)||CM.reply===c.id;
    const head=c.deleted?`<div class="cmt gone"><p>🗑️ 삭제된 댓글이에요</p>`:`<div class="cmt"><div class="cn">${b?'<span class="best">BEST</span>':''}${name(c)}<span class="dd">${ago(c.created_at)}</span></div><p>${esc(c.body)}</p>`;
    return `${head}<div class="ca">${c.deleted?'':acts(c)}<button class="rbtn ${open?'on':''}" onclick="toggleReplies(${c.id},${epId})">💬 답글 ${rs.length?rs.length+(open?' ▴':' ▾'):''}</button></div>
      ${open?`<div class="reps">${rs.map(rep).join('')}
        ${c.deleted?'':`<div class="cmt-w rw"><textarea id="rIn${c.id}" placeholder="${canW?'답글을 남겨주세요':ME?'정지 상태라 답글을 달 수 없어요':'로그인 후 답글을 남길 수 있어요'}" maxlength="300" ${canW?'':'readonly onclick="needLogin()"'}></textarea><button class="btn btn-p" onclick="addReply(${c.id},${epId})">등록</button></div>`}</div>`:''}</div>`;
  };
  $('#cmtArea').innerHTML=`<div style="font-weight:900;font-size:16px">댓글 <span style="color:var(--blue)">${total}</span></div>
    <div class="cmt-w"><textarea id="cmtIn" placeholder="${ME?(banned()?'정지 상태라 댓글을 달 수 없어요':'댓글을 남겨주세요'):'로그인 후 댓글을 남길 수 있어요'}" maxlength="300" ${canW?'':'readonly onclick="needLogin()"'}></textarea><button class="btn btn-p" onclick="addCmt(${epId})">등록</button></div>
    ${best.map(c=>one(c,true)).join('')}${rest.map(c=>one(c,false)).join('')}`;
  if(CM.reply){const t=$('#rIn'+CM.reply);if(t&&canW)t.focus();CM.reply=null}
}

/* ================= 이미지 도우미 ================= */
function loadImg(src,cors){return new Promise((res,rej)=>{const i=new Image();if(cors)i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function fileToCanvas(file,W,H){
  const url=URL.createObjectURL(file);try{const img=await loadImg(url);return coverCanvas(img,W,H)}finally{URL.revokeObjectURL(url)}
}
function coverCanvas(src,W,H){
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const sw=src.naturalWidth||src.width,sh=src.naturalHeight||src.height;
  const s=Math.max(W/sw,H/sh);x.drawImage(src,(W-sw*s)/2,(H-sh*s)/2,sw*s,sh*s);return c;
}
function titleCard(title,author){
  const c=document.createElement('canvas');c.width=480;c.height=640;const x=c.getContext('2d');
  const h=Math.floor(Math.random()*360);const g=x.createLinearGradient(0,0,0,640);
  g.addColorStop(0,`hsl(${h},70%,68%)`);g.addColorStop(1,`hsl(${h+40},60%,38%)`);x.fillStyle=g;x.fillRect(0,0,480,640);
  for(let i=0;i<7;i++){x.fillStyle='rgba(255,255,255,.08)';x.beginPath();x.arc(Math.random()*480,Math.random()*640,30+Math.random()*90,0,7);x.fill()}
  x.fillStyle='#fff';x.textAlign='center';x.font='900 52px "Noto Sans KR",sans-serif';
  const lines=[];let cur='';for(const ch of title){if(x.measureText(cur+ch).width>400){lines.push(cur);cur=ch}else cur+=ch}lines.push(cur);
  lines.slice(0,4).forEach((l,i)=>x.fillText(l,240,300+i*62-(lines.length-1)*31));
  x.font='500 24px "Noto Sans KR",sans-serif';x.globalAlpha=.9;x.fillText(author||'',240,580);return c;
}
function canvasBlob(c,q){return new Promise(res=>c.toBlob(b=>{if(b&&b.type==='image/webp')return res(b);c.toBlob(b2=>res(b2),'image/jpeg',q)},'image/webp',q))}
function ogOf(p){return p?p.replace(/\.(webp|jpg)$/,'_og.jpg'):null}
async function uploadOg(c,base){
  // 카톡 미리보기용 JPG (가로형 1200x630, 가운데 표지 + 흐린 배경)
  const o=document.createElement('canvas');o.width=1200;o.height=630;const x=o.getContext('2d');
  x.filter='blur(30px) brightness(.75)';const s=Math.max(1200/c.width,630/c.height)*1.15;x.drawImage(c,(1200-c.width*s)/2,(630-c.height*s)/2,c.width*s,c.height*s);
  x.filter='none';const h=570,w=h*c.width/c.height;x.fillStyle='rgba(0,0,0,.25)';x.fillRect(600-w/2+8,38,w,h);x.drawImage(c,600-w/2,30,w,h);
  const blob=await new Promise(r=>o.toBlob(r,'image/jpeg',0.85));
  const {error}=await sb.storage.from(CFG.bucket).upload(`${base}_og.jpg`,blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:true});if(error)throw error;
}
async function uploadCanvas(c,base,q){
  const blob=await canvasBlob(c,q||0.85);const ext=blob.type==='image/webp'?'webp':'jpg';const path=`${base}.${ext}`;
  const {error}=await sb.storage.from(CFG.bucket).upload(path,blob,{contentType:blob.type,cacheControl:'31536000',upsert:false});
  if(error)throw error;return path;
}

function penaltyForm({title,kind}){
  // kind: application / work / episode / user
  const lv=[
    [0,'반려만',kind==='application'?'신청만 돌려보내요. 바로 다시 신청할 수 있어요.':'콘텐츠를 돌려보내요. 고쳐서 다시 제출할 수 있어요.'],
    [1,kind==='user'||kind==='application'?'경고':'삭제 + 경고','경고 1회를 쌓아요.'+(kind==='work'||kind==='episode'?' 콘텐츠는 휴지통으로 가요(7일 뒤 영구 삭제, 작가는 되살릴 수 없어요).':'')],
    [2,'작가 자격 박탈','독자로 돌아가요. 연재하려면 작가 신청을 다시 해야 해요.'+(kind==='work'||kind==='episode'?' 콘텐츠는 휴지통으로 가요(7일 뒤 영구 삭제, 작가는 되살릴 수 없어요).':'')],
    [3,'기간 정지','정해진 기간 동안 업로드·댓글·별점·작가 신청을 모두 못 해요.'],
    [4,'영구 정지','보기만 할 수 있어요. 징계 해제 전까지 유지돼요.']
  ].filter(([n])=>!(kind==='user'&&n===0)&&!(kind==='application'&&n===2));
  const quick=kind==='application'?['소개가 너무 짧아요','장난 신청이에요','작가명이 부적절해요']:kind==='user'?['욕설/비방 댓글','도배','부적절한 콘텐츠']:['분량 부족','대충 그림','부적절한 내용','도용 의심','제목/소개 부적절'];
  return new Promise(res=>{
    const m=modal(`<div class="mh"><h2>${esc(title)}</h2><button class="x" data-close>×</button></div><div class="mb">
      <label class="fl">${kind==='user'?'징계':'거절'} 사유 <small>(필수 · 본인에게 그대로 보여요)</small></label>
      <div class="qchips">${quick.map(q=>`<button>${q}</button>`).join('')}</div>
      <textarea class="fi" id="pnR" maxlength="300" placeholder="사유를 적어 주세요"></textarea>
      <label class="fl">징계 수위</label>
      <div class="lv">${lv.map(([n,t,d],i)=>`<label><input type="radio" name="pnL" value="${n}" ${i===0?'checked':''}><div><b>${t}</b><span>${d}</span></div></label>`).join('')}</div>
      <div id="pnDw" hidden><label class="fl">정지 기간</label><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${[1,3,7,30].map(d=>`<button class="sm" data-dd="${d}">${d}일</button>`).join('')}<input class="fi" id="pnD" type="number" min="1" max="3650" value="7" style="width:90px"> 일</div></div>
      <div class="err" id="pnE"></div></div>
      <div class="mf"><button class="btn btn-o" data-close>취소</button><button class="btn btn-r" id="pnGo">${kind==='user'?'징계하기':'거절하기'}</button></div>`,{onClose:()=>res(null)});
    m.querySelectorAll('.qchips button').forEach(b=>b.onclick=()=>{const t=m.querySelector('#pnR');t.value=t.value?t.value+', '+b.textContent:b.textContent});
    const upd=()=>{m.querySelector('#pnDw').hidden=m.querySelector('input[name=pnL]:checked').value!=='3'};
    m.querySelectorAll('input[name=pnL]').forEach(r=>r.onchange=upd);
    m.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>m.querySelector('#pnD').value=b.dataset.dd);
    m.querySelector('#pnGo').onclick=()=>{
      const reason=m.querySelector('#pnR').value.trim();if(!reason){m.querySelector('#pnE').textContent='사유를 적어 주세요';return}
      const level=+m.querySelector('input[name=pnL]:checked').value,days=Math.max(1,+m.querySelector('#pnD').value||1);
      m.remove();res({reason,level,days});
    };
  });
}
async function review(kind,id,approve){
  let p={reason:'',level:0,days:7};
  if(!approve){p=await penaltyForm({title:{application:'작가 신청 거절',work:'작품 거절',episode:'회차 거절'}[kind],kind});if(!p)return false}
  else if(!await ask('승인할까요?'))return false;
  const {data:paths,error}=await sb.rpc('admin_review',{p_kind:kind,p_id:id,p_approve:approve,p_reason:p.reason,p_level:p.level,p_days:p.days});
  if(error){toast(errMsg(error));return false}
  if(paths&&paths.length)await removeFiles(paths);
  C.works=null;toast(approve?'승인했어요':'거절했어요');pageAdmin();return true;
}

const IDB={
  db:null,

  async op(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('drafts',mode);const st=tx.objectStore('drafts');const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})},
  get(k){return this.op('readonly',s=>s.get(k))},set(k,v){return this.op('readwrite',s=>s.put(v,k))},del(k){return this.op('readwrite',s=>s.delete(k))}

async function openEditorFor(workId,epId){
  if(needAct())return;
  if(!isAuthor())return toast('작가만 그릴 수 있어요');
  const {data:w}=await sb.from('works').select('id,title,status,author_id,finished').eq('id',workId).single();
  if(!w||w.author_id!==ME.id)return toast('내 작품에만 그릴 수 있어요');
  if(w.status!=='approved')return toast('승인된 작품에만 회차를 올릴 수 있어요');
  let ep=null;
  if(epId){const {data}=await sb.from('episodes').select('*').eq('id',epId).single();ep=data;if(!ep||ep.status!=='rejected')return toast('반려된 회차만 다시 그릴 수 있어요')}
  edMode('ep');
  const kind=ep?(ep.kind||'ep'):(w.finished?'after':'ep');
  Object.assign(ED,edState({mode:'ep',kind,work:w,editEp:ep,seconds:ep?ep.draw_seconds:0,note:ep?ep.author_note:''}));
  $('#edWork').textContent=w.title+(kind==='after'?' · ✍️ 후기':'');$('#edTitle').value=ep?ep.title:'';
  $('#edTitle').placeholder=kind==='after'?'후기 제목 (예: 완결 후기)':'회차 제목 (예: 1화 - 시작)';
  if(kind==='after'&&!ep)toast('완결 후기예요. 분량·작업 시간 제한 없이 자유롭게 그려요',3500);
  $('#editor').hidden=false;document.body.style.overflow='hidden';
  edBuildTools();
  let draft=await IDB.get(draftKey()).catch(()=>null);if(draft&&!(draft.cuts&&draft.cuts.length))draft=null;
  const srv=await drFind(ep?'re:'+ep.id:'ep:'+w.id);
  let loaded=false;
  const pick=await drPick(draft,srv);
  if(srv){ED.sid=srv.id;ED.sfiles=new Set(srv.files||[]);ED.slast=Date.parse(srv.updated_at)}
  if(pick==='srv'){
    try{const r=await drLoad(srv);ED.cuts.push(...r.cuts);const m=r.meta;ED.seconds=m.seconds||srv.seconds||ED.seconds;ED.note=m.note??ED.note;$('#edTitle').value=m.title||$('#edTitle').value;
      draft={bgm:m.bgm};loaded=true;sb.from('drafts').update({warned:false}).eq('id',srv.id).then(()=>{});toast('☁️ 저장본을 불러왔어요')}
    catch(e){console.error(e);toast('저장본을 불러오지 못했어요: '+errMsg(e),4000)}
  }else if(pick==='loc'){
    for(const d of draft.cuts)ED.cuts.push(await cutFromDraft(d));ED.cuts.forEach(c=>c._sd=true);ED.sdirty=true;
    ED.seconds=draft.seconds||ED.seconds;ED.note=draft.note||ED.note;$('#edTitle').value=draft.title||$('#edTitle').value;loaded=true;
  }else if(draft)await IDB.del(draftKey()).catch(()=>{});
  if(!loaded&&ep){
    toast('반려된 회차를 불러오는 중…');
    for(const p of ep.pages){try{const img=await loadImg(pub(p),true);const cut=newCut(img.naturalWidth,img.naturalHeight,true);cut.layers[0].name='불러온 그림';cut.layers[0].x.drawImage(img,0,0);
      cut.layers.push(newLayer(cut.w,cut.h,'수정'));cut.li=1;ED.cuts.push(cut)}catch(e){console.error(e)}}
  }
  if(!ED.cuts.length)ED.cuts.push(newCut(720,960));
  ED.bgm=bgmIn(loaded?draft.bgm:(ep?ep.bgm:null));bgmBtnPaint();

    else stampLine(sx,a,p,st,(x,q,w)=>{const r=w*1.6;const g=x.createRadialGradient(q.x,q.y,0,q.x,q.y,r);g.addColorStop(0,'rgba(0,0,0,.18)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(q.x-r,q.y-r,r*2,r*2)},eraserW(st),0.25);
    st.dist+=d;st.last=p;return;
  }
  stamp(sx,a,p,st,false);st.dist+=d;st.last=p;
}
function bw(st){ // 붓 굵기 (필압 · 속도 · 시작 가늘게)
  const s=ED.size,b=ED.brush,pr=st.pr;
  const taper=Math.min(1,0.25+st.dist/(s*5));
  const spd=Math.max(0.35,Math.min(1.25,1.3-st.v*0.35));
  if(b==='gpen')return s*(pr!=null?0.08+Math.pow(pr,1.5)*1.9:spd)*taper;
  if(b==='brushpen')return s*1.7*(pr!=null?0.12+pr*1.5:spd)*taper;
  if(b==='pen')return s*(pr!=null?0.3+pr*1.4:1);
  if(b==='pencil')return s*(pr!=null?0.5+pr*0.8:1);
  if(b==='marker')return s*3;
  if(b==='air')return s*4*(pr!=null?0.4+pr:1);
  if(b==='water')return s*2.6*(pr!=null?0.5+pr*0.8:1);
  if(b==='crayon')return s*1.8;
  return s;
}
function stamp(x,a,p,st,first){
  const b=ED.brush,w=bw(st);x.fillStyle=ED.color;x.strokeStyle=ED.color;
  if(b==='pen'||b==='marker'){x.save();x.lineCap='round';x.lineJoin='round';x.lineWidth=w;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(p.x+(first?0.01:0),p.y);x.stroke();x.restore();return}
  if(b==='gpen'||b==='brushpen'){const w0=st.lw==null?w:st.lw;stampLine(x,a,p,st,(x,q,ww)=>{x.beginPath();x.arc(q.x,q.y,Math.max(0.35,ww/2),0,7);x.fill()},w,0.18,w0);st.lw=w;return}
  if(b==='pencil'){let sd=st.seed;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
    stampLine(x,a,p,st,(x,q,ww)=>{const n=Math.max(3,ww*1.2);for(let i=0;i<n;i++){const ang=rnd()*6.283,r=Math.sqrt(rnd())*ww/2;x.globalAlpha=0.35+rnd()*0.5;x.fillRect(q.x+Math.cos(ang)*r,q.y+Math.sin(ang)*r,1.1,1.1)}x.globalAlpha=1;st.seed=sd},w,0.35);return}
  if(b==='crayon'){let sd=st.seed;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
    stampLine(x,a,p,st,(x,q,ww)=>{const n=ww*2.5;for(let i=0;i<n;i++){const ang=rnd()*6.283,r=Math.sqrt(rnd())*ww/2;x.globalAlpha=0.5+rnd()*0.5;x.fillRect(q.x+Math.cos(ang)*r,q.y+Math.sin(ang)*r,1.6+rnd()*1.4,1.6+rnd()*1.4)}x.globalAlpha=1;st.seed=sd},w,0.3);return}
  if(b==='air'){const [r,g,bb]=hexRgb(ED.color);stampLine(x,a,p,st,(x,q,ww)=>{const rr=ww;const gr=x.createRadialGradient(q.x,q.y,0,q.x,q.y,rr);gr.addColorStop(0,`rgba(${r},${g},${bb},.09)`);gr.addColorStop(1,`rgba(${r},${g},${bb},0)`);x.fillStyle=gr;x.fillRect(q.x-rr,q.y-rr,rr*2,rr*2)},w,0.22);return}
  if(b==='water'){const [r,g,bb]=hexRgb(ED.color);stampLine(x,a,p,st,(x,q,ww)=>{const rr=ww/2*(0.85+Math.random()*0.3);const gr=x.createRadialGradient(q.x,q.y,rr*0.4,q.x,q.y,rr);gr.addColorStop(0,`rgba(${r},${g},${bb},.07)`);gr.addColorStop(0.85,`rgba(${r},${g},${bb},.1)`);gr.addColorStop(1,`rgba(${r},${g},${bb},0)`);x.fillStyle=gr;x.beginPath();x.arc(q.x,q.y,rr,0,7);x.fill()},w,0.2);return}
}
function stampLine(x,a,p,st,fn,w,spacing,w0){
  const d=Math.hypot(p.x-a.x,p.y-a.y),step=Math.max(0.5,w*spacing);const n=Math.max(1,Math.ceil(d/step));

  for(let i=1;i<=n;i++){const t=i/n;const ww=w0!=null?w0+(w-w0)*t:w;fn(x,{x:a.x+(p.x-a.x)*t,y:a.y+(p.y-a.y)*t},ww)}
}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}

/* 채우기: 보이는 그림 전체를 경계로 지금 레이어에 칠하기 */
function edFill(sx,sy){
  const c=cur(),W=c.w,H=c.h;if(sx<0||sy<0||sx>=W||sy>=H)return;
  const ref=compose(c,{noObjs:true}).getContext('2d').getImageData(0,0,W,H).data;
  const lyr=L(),img=lyr.x.getImageData(0,0,W,H),d=img.data,[fr,fg,fb]=hexRgb(ED.color);
  const s=(sy*W+sx)*4,tr=ref[s],tg=ref[s+1],tb=ref[s+2];
  const tol=110,vis=new Uint8Array(W*H);
  const m=i=>{const k=i*4;return Math.abs(ref[k]-tr)+Math.abs(ref[k+1]-tg)+Math.abs(ref[k+2]-tb)<=tol};
  const set=i=>{const k=i*4;d[k]=fr;d[k+1]=fg;d[k+2]=fb;d[k+3]=255;vis[i]=1};
  const stack=[sx,sy];
  while(stack.length){
    const y=stack.pop();let x=stack.pop();let i=y*W+x;
    while(x>=0&&!vis[i]&&m(i)){x--;i--}x++;i++;
    let up=false,dn=false;
    while(x<W&&!vis[i]&&m(i)){
      set(i);
      if(y>0){const j=i-W;if(!vis[j]&&m(j)){if(!up){stack.push(x,y-1);up=true}}else up=false}
      if(y<H-1){const j=i+W;if(!vis[j]&&m(j)){if(!dn){stack.push(x,y+1);dn=true}}else dn=false}
      x++;i++;
    }
  }
  // 선 아래로 1~2px 넓혀서 틈 메우기
  for(let pass=0;pass<2;pass++){const grow=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;if(vis[i])continue;if(vis[i-1]||vis[i+1]||vis[i-W]||vis[i+W])grow.push(i)}grow.forEach(set)}
  lyr.x.putImageData(img,0,0);
}

async function edLayerAct(a){

  if(a==='up'&&i<c.layers.length-1){c.layers.splice(i,1);c.layers.splice(i+1,0,l);c.li=i+1}

const FONTS=[
  ['Noto Sans KR','기본 고딕',700],['Jua','주아체',400],['Do Hyeon','도현체',400],['Black Han Sans','검은고딕',400],

function fontOf(o){return FONTS.find(f=>f[0]===o.font)||FONTS[0]}
function fontStr(o){const F=fontOf(o);return `${F[2]} ${o.fs}px "${F[0]}", "Noto Sans KR", sans-serif`}
function loadFont(name){const F=FONTS.find(f=>f[0]===name)||FONTS[0];return document.fonts?document.fonts.load(`${F[2]} 40px "${F[0]}"`,'가A').catch(()=>{}):Promise.resolve()}

function bLayout(o){
  MCTX.font=fontStr(o);const lines=(o.text||' ').split('\n');const tw=Math.max(o.fs*0.6,...lines.map(l=>MCTX.measureText(l).width));
  const lh=o.fs*1.3,th=lh*lines.length,rx=tw/2+o.fs*1.1,ry=th/2+o.fs*0.9;let hx=rx,hy=ry;
  if(o.style==='shout'){hx=rx*1.32;hy=ry*1.32}else if(o.style==='box'){hx=tw/2+o.fs*0.7;hy=th/2+o.fs*0.5}else if(o.style==='plain'){hx=tw/2+o.fs*0.15;hy=th/2}

/* ===== 도형 ===== */
const SHAPES=[['rect','⬛','사각형'],['round','▢','둥근 사각형'],['ellipse','⬤','원'],['tri','▲','삼각형'],['diamond','◆','마름모'],['star','★','별'],['heart','♥','하트'],['arrow','➡','화살표'],['burst','💥','폭발'],['cloud','☁','구름']];
function shapePath(c,k,w,h){
  const a=w/2,b=h/2;c.beginPath();
  if(k==='rect')c.rect(-a,-b,w,h);
  else if(k==='round'){const r=Math.min(w,h)*0.2;c.moveTo(-a+r,-b);c.arcTo(a,-b,a,b,r);c.arcTo(a,b,-a,b,r);c.arcTo(-a,b,-a,-b,r);c.arcTo(-a,-b,a,-b,r);c.closePath()}
  else if(k==='ellipse')c.ellipse(0,0,a,b,0,0,Math.PI*2);
  else if(k==='tri'){c.moveTo(0,-b);c.lineTo(a,b);c.lineTo(-a,b);c.closePath()}
  else if(k==='diamond'){c.moveTo(0,-b);c.lineTo(a,0);c.lineTo(0,b);c.lineTo(-a,0);c.closePath()}
  else if(k==='star'){for(let i=0;i<10;i++){const t=-Math.PI/2+i*Math.PI/5,r=i%2?0.42:1;const x=Math.cos(t)*a*r,y=Math.sin(t)*b*r+b*0.1;i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath()}

  if(c.type==='px'){const same=c.cut===ED.cur,off=same?20:0;const pc={t:'p',img:c.canvas,x:c.x+off,y:c.y+off,w:c.canvas.width,h:c.canvas.height,rot:0,layer:L()};cur().objs.push(pc);edTool('select');ED.sel=pc;ED.multi=[];edObjBar();edRenderOv();edChanged();toast(`붙여넣었어요. 옮긴 뒤 다른 곳을 누르면 '${L().name}' 레이어에 찍혀요`,2800);return true}
  if(c.type==='els'){const off=c.cut===ED.cur?24:0;const ns=c.items.map(o=>{const n=cloneEl(o,off,off);listOf(n).push(n);return n});c.items=ns.map(o=>({...o}));c.cut=ED.cur;
    edTool('select');if(ns.length>1){ED.multi=ns;ED.sel=ns[ns.length-1]}else{ED.sel=ns[0];ED.multi=[]}edObjBar();edRenderRefs();edRenderOv();edChanged();toast('붙여넣었어요');return true}
  return false;
}
async function edPasteImage(blob){
  let img;try{img=await loadImg(URL.createObjectURL(blob))}catch(_){return toast('이미지를 열 수 없어요')}
  const v=await choose('이미지를 어떻게 넣을까요?',[{t:'취소',v:null},{t:'📷 참고 이미지로 깔기 (대고 그리기)',v:'ref',cls:'btn-o'},{t:'🧩 그림 조각으로 붙이기',v:'piece',cls:'btn-p'}]);
  if(!v)return;

  const c=cur(),s=Math.min(c.w*0.8/img.naturalWidth,c.h*0.8/img.naturalHeight,1),w=img.naturalWidth*s,h=img.naturalHeight*s;
  edDeselect();edPush();const pc={t:'p',img,x:(c.w-w)/2,y:(c.h-h)/2,w,h,rot:0,layer:L()};cur().objs.push(pc);edTool('select');ED.sel=pc;ED.multi=[];edObjBar();edRenderOv();edChanged();

}
document.addEventListener('paste',e=>{
  if(!ED.open||document.getElementById('studio')||document.querySelector('.mbg'))return;const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  const items=[...(e.clipboardData?e.clipboardData.items:[])];const it=items.find(i=>i.type.startsWith('image/'));
  e.preventDefault();
  if(it){edPasteImage(it.getAsFile());return}
  if(!edPasteInternal())toast('붙여넣을 게 없어요. 그림을 선택해서 Ctrl+C 하거나, 인터넷에서 이미지를 복사해 오세요');
});
async function edPasteBtn(){

  if(!edPasteInternal())toast('붙여넣을 이미지가 없어요. 이미지를 복사한 뒤 다시 눌러 주세요 (처음엔 브라우저가 권한을 물어봐요)',3500);
}
function edBindDrop(){const st=$('#edStage');if(st._drop)return;st._drop=true;

function edRotSync(){const o=ED.sel,pn=$('#edPanel');if(!o||o.t!=='b'||pn.dataset.kind!=='text')return;[['tpR','rot'],['tpTR','trot']].forEach(([id,k])=>{const i=pn.querySelector('#'+id);if(i){let d=Math.round((o[k]||0)*180/Math.PI);d=((d+540)%360)-180;i.value=d;pn.querySelector('#'+id+'v').textContent=d+'°'}})}

async function objsToDraft(objs){
  const out=[];for(const o of objs||[]){
    if(o.t==='i'){let blob=o.blob;if(!blob){const c=document.createElement('canvas');c.width=o.img.naturalWidth;c.height=o.img.naturalHeight;c.getContext('2d').drawImage(o.img,0,0);blob=await new Promise(r=>c.toBlob(r,'image/png'))}
      out.push({t:'i',x:o.x,y:o.y,w:o.w,h:o.h,blob})}
    else{const {img,...rest}=o;out.push(rest)}
  }return out;
}
async function objsFromDraft(list){

    if(d.t==='i'){try{const img=await loadImg(URL.createObjectURL(d.blob));out.push({...d,img})}catch(_){}}
    else out.push({...d});
  }return out;
}

    else if(op==='down'&&i<ED.cuts.length-1){[ED.cuts[i+1],ED.cuts[i]]=[ED.cuts[i],ED.cuts[i+1]];ED.cur=i+1}
    else if(op==='dup'){ED.cuts.splice(i+1,0,cloneCut(ED.cuts[i]));ED.cur=i+1}
    else if(op==='del'){if(ED.cuts.length<2)return toast('컷이 하나는 있어야 해요');if(!await ask(`${i+1}번 컷을 삭제할까요?`,{ok:'삭제',danger:true}))return;ED.cuts.splice(i,1);ED.cur=Math.min(ED.cur,ED.cuts.length-1)}
    else if(!op){edSelect(i);return}
    ED.dirty=ED.sdirty=true;edSelect(ED.cur);edRenderCuts();edReq();
  });
}

function edCheck(){

  const empty=ED.cuts.map((c,i)=>c.ink<CFG.minInk?i+1:0).filter(Boolean),n=ED.cuts.length-empty.length;
  const okC=n>=CFG.minCuts,okE=empty.length<=CFG.maxEmpty,okT=ED.seconds>=CFG.minSec;

async function drDl(p){const {data,error}=await sb.storage.from(DR_BUCKET).download(p);if(error)throw error;return data}
async function drLoad(row){

  for(const d of list){toast(`☁️ 저장본 불러오는 중… ${++i}/${list.length}`,8000);
    const cut={w:d.w,h:d.h,li:d.li||0,layers:[],refs:[],objs:[],ink:0,thumb:''};

    d.layers.forEach((l,k)=>{const n=newLayer(d.w,d.h,l.name);n.vis=l.vis;n.op=l.op;n.x.drawImage(imgs[k],0,0);n._sp=l.f;cut.layers.push(n)});
    for(const r of d.refs||[]){try{const b=await drDl(r.f);const {f,...rest}=r;cut.refs.push({t:'r',...rest,img:await blobImg(b),blob:b,_sp:f})}catch(_){}}

async function drSha(blob){const h=await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());return [...new Uint8Array(h)].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('')}
const blobOf=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));

async function edSaveServer(show){

        const {data:n,error}=await sb.from('drafts').insert({key,kind,work_id:ED.mode==='cover'?(ED.coverWork||null):ED.work.id,episode_id:ED.editEp?ED.editEp.id:null}).select('id').single();

    const up=async blob=>{const ext=blob.type==='image/webp'?'webp':'png',path=`${ME.id}/${id}/${await drSha(blob)}.${ext}`;
      if(!known.has(path)){const {error}=await sb.storage.from(DR_BUCKET).upload(path,blob,{contentType:blob.type,upsert:true});if(error&&!/exist/i.test(error.message||''))throw error;known.add(path)}

      const refs=[];for(const r of c.refs){const f=(r._sp&&known.has(r._sp))?keep(r._sp):(r._sp=await up(r.blob||await imgBlob(r.img)));refs.push({x:r.x,y:r.y,w:r.w,h:r.h,op:r.op,vis:r.vis,inc:r.inc,cx:r.cx,cy:r.cy,cw:r.cw,ch:r.ch,f})}
      const objs=[];for(const o of c.objs){if(o.t==='i'){const f=(o._sp&&known.has(o._sp))?keep(o._sp):(o._sp=await up(o.blob||await imgBlob(o.img)));objs.push({t:'i',x:o.x,y:o.y,w:o.w,h:o.h,f})}
        else{const {img,_sp,...rest}=o;objs.push(rest)}}

    tc.getContext('2d').drawImage(compose(c0),0,0,c0.w,Math.min(c0.h,th*c0.w/tw),0,0,tw,th);

}

async function cutFromDraft(d){

    const cut=newCut(d.w,d.h,true);cut.layers[0].name='그림';const img=await blobImg(d.blob);cut.layers[0].x.drawImage(img,0,0);
    for(const o of await objsFromDraft(d.objs)){if(o.t==='i')cut.refs.push({t:'r',img:o.img,blob:o.blob,x:o.x,y:o.y,w:o.w,h:o.h,op:1,vis:true,inc:true});else cut.objs.push(o)}

/* ---- 음악 올리기: 브라우저에서 3분·80kbps mp3로 줄여서 ---- */
function pickAudioFile(){return new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept='audio/*,.mp3,.m4a,.wav,.ogg';i.onchange=()=>r(i.files[0]||null);i.click()})}
async function loadLame(){if(window.lamejs)return;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='vendor/lame.min.js';s.onload=ok;s.onerror=()=>no(new Error('음악 변환기를 불러오지 못했어요'));document.head.appendChild(s)})}
function askText(title,label,val,max){
  return new Promise(res=>{const m=modal(`<div class="mh"><h2>${esc(title)}</h2><button class="x" data-close>×</button></div>
    <div class="mb"><label class="fl" style="margin-top:0">${esc(label)}</label><input class="fi" id="atxt" maxlength="${max||40}" value="${esc(val||'')}"></div>
    <div class="mf"><button class="btn btn-o" data-close>취소</button><button class="btn btn-p" id="atxtGo">확인</button></div>`,{onClose:()=>res(null)});
    const i=m.querySelector('#atxt');setTimeout(()=>{i.focus();i.select()},30);

async function uploadSong(){
  if(needAct())return false;
  const f=await pickAudioFile();if(!f)return false;
  if(f.size>80*1024*1024){toast('파일이 너무 커요');return false}
  let ab;
  try{toast('음악 읽는 중…',8000);const ctx=new (window.AudioContext||window.webkitAudioContext)();
    try{ab=await ctx.decodeAudioData(await f.arrayBuffer())}finally{try{ctx.close()}catch(_){}}}
  catch(e){toast('이 파일은 읽을 수 없어요 (mp3, m4a, wav 파일을 써 주세요)',3500);return false}
  const dur=ab.duration,cut=dur>BGM_MAX_SEC+0.5,use=Math.min(dur,BGM_MAX_SEC);
  if(cut&&!await ask(`이 곡은 ${mmss(Math.round(dur))} 길이예요.\n한 곡은 최대 3분이라서, 앞 3분만 잘라서 올릴게요.\n(끝부분은 자연스럽게 작아지게 해요)`,{ok:'앞 3분만 올리기'}))return false;
  const title=await askText('음악 이름','음악함에 표시될 이름',f.name.replace(/\.[^.]+$/,'').slice(0,40));if(!title)return false;
  const pm=modal(`<div class="mb" style="padding:30px 24px;text-align:center"><b id="usT">음악을 줄이는 중… 0%</b><div class="ubar"><i id="usB"></i></div><p class="bgm-tip" style="margin-top:12px">창을 닫지 말고 잠깐만 기다려 주세요</p></div>`);
  pm.onmousedown=null;pm._close=()=>{};
  const prog=p=>{pm.querySelector('#usT').textContent=p>=1?'올리는 중…':`음악을 줄이는 중… ${Math.round(p*100)}%`;pm.querySelector('#usB').style.width=Math.round(p*100)+'%'};
  let path=null;
  try{
    const SR=44100,N=Math.ceil(use*SR);
    const off=new OfflineAudioContext(2,N,SR);const src=off.createBufferSource();src.buffer=ab;const g=off.createGain();
    src.connect(g);g.connect(off.destination);
    if(cut){g.gain.setValueAtTime(1,Math.max(0,use-3));g.gain.linearRampToValueAtTime(0,use)}
    src.start(0);const out=await off.startRendering();
    await loadLame();const enc=new lamejs.Mp3Encoder(2,SR,80);
    const L=out.getChannelData(0),R=out.getChannelData(1),blk=1152,parts=[];
    const to16=(a,o,m)=>{const r=new Int16Array(m);for(let j=0;j<m;j++){const v=a[o+j];r[j]=v<=-1?-32768:v>=1?32767:(v*32767)|0}return r};
    for(let i=0,k=0;i<N;i+=blk,k++){
      const m=Math.min(blk,N-i);const d=enc.encodeBuffer(to16(L,i,m),to16(R,i,m));if(d.length)parts.push(new Uint8Array(d));
      if(k%150===0){prog(i/N*0.98);await new Promise(r=>setTimeout(r,0))}
    }
    const fl=enc.flush();if(fl.length)parts.push(new Uint8Array(fl));
    const blob=new Blob(parts,{type:'audio/mpeg'});prog(1);
    if(blob.size>5*1024*1024)throw new Error('변환한 파일이 너무 커요');
    path=`${ME.id}/bgm/${Date.now()}.mp3`;
    const {error:ue}=await sb.storage.from(CFG.bucket).upload(path,blob,{contentType:'audio/mpeg',cacheControl:'31536000',upsert:false});if(ue)throw ue;
    const {error}=await sb.from('songs').insert({title,path,seconds:Math.max(1,Math.round(use)),size:blob.size});if(error)throw error;
    pm.remove();toast(`음악함에 올렸어요 (${(blob.size/1048576).toFixed(1)}MB)`);return true;
  }catch(e){
    console.error(e);pm.remove();if(path)await removeFiles([path]).catch(()=>{});
    toast('올리지 못했어요: '+errMsg(e),4000);return false;
  }
}

/* ---- 그림판: 회차 BGM 설정 ---- */
function bgmIn(j){
  const B={mode:'none',one:null,list:[]};if(!j||!j.list||!j.list.length)return B;
  if(j.mode==='scene'){B.mode='scene';B.list=j.list.map(r=>({cut:ED.cuts[Math.max(0,Math.min(r.at|0,ED.cuts.length-1))],s:r.s||null,t:r.t||''}))}
  else{B.mode='one';B.one={s:j.list[0].s,t:j.list[0].t||''}}
  return B;
}
function bgmOut(){
  const B=ED.bgm;if(!B||B.mode==='none')return null;
  if(B.mode==='one')return B.one&&B.one.s?{mode:'one',list:[{at:0,s:B.one.s,t:B.one.t}]}:null;
  const list=B.list.map(r=>({at:ED.cuts.indexOf(r.cut),s:r.s,t:r.t})).filter(r=>r.at>=0).sort((a,b)=>a.at-b.at);
  return list.some(r=>r.s)?{mode:'scene',list}:null;
}

        :`<div class="empty" style="padding:22px 0">아래 버튼으로 음악이 바뀌는 장면을 넣어 보세요</div>`;

/* ---- 뷰어: BGM 재생 ---- */
const BP={a:null,s:null,data:null,on:false,raf:0,vol:0.6,fades:[]};
try{BP.vol=Math.min(1,Math.max(0,+(localStorage.getItem('bgmVol')||0.6)))}catch(_){}
function bgmFade(a,to,ms,done){
  const from=a.volume,t0=performance.now();
  const id=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);try{a.volume=Math.max(0,Math.min(1,from+(to-from)*k))}catch(_){}
    if(k>=1){clearInterval(id);done&&done()}},40);
  BP.fades.push(id);
}
function bgmStop(){
  cancelAnimationFrame(BP.raf);window.removeEventListener('scroll',bgmScroll);
  if(BP.a){const a=BP.a;bgmFade(a,0,400,()=>{a.pause();a.src=''})}
  BP.a=null;BP.s=null;BP.data=null;const box=$('#bgmBox');if(box)box.remove();
}
function bgmWant(){
  const d=BP.data;if(!d)return null;
  if(d.mode!=='scene')return d.list[0];
  const imgs=document.querySelectorAll('.panels img');const line=innerHeight*0.45;let idx=0;
  imgs.forEach((im,i)=>{if(im.getBoundingClientRect().top<=line)idx=i});
  let cur=null;for(const r of d.list)if(r.at<=idx)cur=r;return cur;
}
function bgmApply(){
  if(!BP.on||!BP.data)return;
  const want=bgmWant(),s=want&&want.s||null;
  if(s===BP.s)return;
  if(BP.a){const old=BP.a;bgmFade(old,0,900,()=>{old.pause();old.src=''})}
  BP.a=null;BP.s=s;bgmPaint(want);
  if(!s)return;
  const a=new Audio(bgmUrl(s));a.loop=true;a.volume=0;BP.a=a;
  a.play().then(()=>bgmFade(a,BP.vol,900)).catch(()=>{if(BP.a===a){BP.on=false;BP.s=null;BP.a=null;bgmPaint(null)}});
}
function bgmScroll(){cancelAnimationFrame(BP.raf);BP.raf=requestAnimationFrame(bgmApply)}
function bgmToggle(on){
  BP.on=on;try{sessionStorage.setItem('bgmOn',on?'1':'')}catch(_){}
  if(on){if(BP.a){BP.a.pause();BP.a=null}BP.s=undefined;bgmApply()}
  else{if(BP.a){const a=BP.a;bgmFade(a,0,500,()=>{a.pause();a.src=''})}BP.a=null;BP.s=null;bgmPaint(null)}
}
function bgmPaint(cur){
  const box=$('#bgmBox');if(!box)return;
  if(!BP.on){box.className='bgm-box';box.innerHTML=`<button class="bgm-on" onclick="bgmToggle(true)">🎵 BGM 켜기</button>`;return}
  box.className='bgm-box playing';
  box.innerHTML=`<span class="eq ${cur&&cur.s?'':'mute'}"><i></i><i></i><i></i></span><span class="bt">${cur&&cur.s?esc(bgmName(cur.s,cur.t)):'🔇 조용한 장면'}</span>
    <input type="range" min="0" max="100" value="${Math.round(BP.vol*100)}" title="볼륨" oninput="bgmVol(this.value)"><button onclick="bgmToggle(false)" title="BGM 끄기">끄기</button>`;
}
function bgmVol(v){BP.vol=v/100;try{localStorage.setItem('bgmVol',BP.vol)}catch(_){}if(BP.a)BP.a.volume=BP.vol}
function bgmSetup(bgm){
  bgmStop();if(!bgm||!bgm.list||!bgm.list.length||!bgm.list.some(r=>r.s))return;
  BP.data=bgm;const box=document.createElement('div');box.id='bgmBox';document.body.appendChild(box);
  let on=false;try{on=sessionStorage.getItem('bgmOn')==='1'}catch(_){}
  BP.on=on;BP.s=undefined;bgmPaint(null);
  window.addEventListener('scroll',bgmScroll,{passive:true});
  if(on)bgmApply();
}
function bgmListHTML(bgm){

  return `<div class="note" style="margin:0 0 12px;background:#f3f6ff;border:1px solid #d6e0ff;color:#334"><b>🎵 BGM · ${bgm.mode==='scene'?'장면마다 바꾸기':'한 곡 반복'}</b>

function elBox(o){ // 요소 하나가 차지하는 범위 (회전·꼬리 포함)
  let pts=[];
  if(o.t==='f'){const R=Math.max(o.rx,o.ry)*1.7;pts=[{x:o.x-R,y:o.y-R},{x:o.x+R,y:o.y+R}]}
  else if(isRotBox(o)){const B=boxOf(o);pts=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>rotPt(o,a*B.w/2,b*B.h/2));if(o.t==='b'&&hasTail(o))pts.push({x:o.tx,y:o.ty})}
  else{const b=objBounds(o);pts=[{x:b.x,y:b.y},{x:b.x+b.w,y:b.y+b.h}]}
  return pts;
}
function selCanvas(list,pad=8){
  const c=cur();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  list.forEach(o=>elBox(o).forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)}));
  x0=Math.max(0,Math.floor(x0-pad));y0=Math.max(0,Math.floor(y0-pad));x1=Math.min(c.w,Math.ceil(x1+pad));y1=Math.min(c.h,Math.ceil(y1+pad));
  const w=Math.max(1,x1-x0),h=Math.max(1,y1-y0),cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.translate(-x0,-y0);
  list.forEach(o=>{if(o.t==='r')drawRef(x,o);else drawObj(x,o)});return {canvas:cv,x0,y0,w,h};
}
function thumbOf(cv,max=360){const s=Math.min(1,max/Math.max(cv.width,cv.height));if(s===1)return cv;const t=document.createElement('canvas');t.width=Math.max(1,Math.round(cv.width*s));t.height=Math.max(1,Math.round(cv.height*s));t.getContext('2d').drawImage(cv,0,0,t.width,t.height);return t}

  if(!isAuthor())return toast('작가만 소재를 저장할 수 있어요');
  pan.style.position='relative';const ov=document.createElement('div');ov.style.cssText='position:absolute;inset:0;z-index:5;cursor:crosshair;background:rgba(30,107,255,.06);touch-action:none';pan.appendChild(ov);pan._hv=ov;
  const box=document.createElement('div');box.style.cssText='position:absolute;border:2px dashed #1E6BFF;background:rgba(30,107,255,.12);display:none;pointer-events:none';ov.appendChild(box);
  toast('저장할 부분을 드래그해서 골라요 (다시 누르면 꺼져요)',3000);
  let st=null;
  ov.onpointerdown=e=>{e.preventDefault();ov.setPointerCapture(e.pointerId);const r=ov.getBoundingClientRect();st={x:e.clientX-r.left,y:e.clientY-r.top,cx:e.clientX,cy:e.clientY};box.style.display='block';Object.assign(box.style,{left:st.x+'px',top:st.y+'px',width:'0px',height:'0px'})};
  ov.onpointermove=e=>{if(!st)return;const r=ov.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;Object.assign(box.style,{left:Math.min(x,st.x)+'px',top:Math.min(y,st.y)+'px',width:Math.abs(x-st.x)+'px',height:Math.abs(y-st.y)+'px'})};
  ov.onpointerup=async e=>{if(!st)return;const a=st;st=null;box.style.display='none';
    const x0=Math.min(a.cx,e.clientX),y0=Math.min(a.cy,e.clientY),x1=Math.max(a.cx,e.clientX),y1=Math.max(a.cy,e.clientY);if(x1-x0<8||y1-y0<8)return;
    // 드래그 범위와 겹치는 그림(컷)들을 한 장으로 이어 붙여서 잘라냄
    const imgs=[...pan.querySelectorAll('img[data-path]')].filter(im=>{const r=im.getBoundingClientRect();return r.bottom>y0&&r.top<y1});if(!imgs.length)return;
    toast('잘라내는 중…');
    try{const r0=imgs[0].getBoundingClientRect(),sc=imgs[0].naturalWidth/r0.width;
      const cv=document.createElement('canvas');cv.width=Math.round((x1-x0)*sc);cv.height=Math.round((y1-y0)*sc);const cx=cv.getContext('2d');
      for(const im of imgs){const r=im.getBoundingClientRect(),src=await loadImg(pub(im.dataset.path),true);const k=src.naturalWidth/r.width;cx.drawImage(src,(r.left-x0)*k,(r.top-y0)*k,r.width*k,r.height*k)}
      tplSaveDialog({canvas:cv,kind:'img',w:cv.width,h:cv.height,folder:'캐릭터'});
    }catch(err){console.error(err);toast('그림을 잘라내지 못했어요')}
  };
}

window.addEventListener('beforeunload',e=>{if(ED.open&&ED.sdirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(ED.open&&e.code==='Space'&&!/INPUT|TEXTAREA/.test(e.target.tagName)&&!document.getElementById('studio')){ED.space=true;e.preventDefault()}});
document.addEventListener('keyup',e=>{if(e.code==='Space')ED.space=false});
document.addEventListener('keydown',e=>{if(!ED.open||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||document.querySelector('.mbg')||document.getElementById('studio'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();edSaveServer(true);return}
  if((e.ctrlKey||e.metaKey)&&(e.key==='='||e.key==='+')){e.preventDefault();edZoomBtn('in')}
  else if((e.ctrlKey||e.metaKey)&&(e.key==='-'||e.key==='_')){e.preventDefault();edZoomBtn('out')}
  else if((e.ctrlKey||e.metaKey)&&e.key==='0'){e.preventDefault();edZoomBtn('fit')}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?edRedo():edUndo()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();edRedo()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){if(edCopy())e.preventDefault()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'){if(ED.area&&ED.area.closed){e.preventDefault();areaAct('cut')}else if(selList().length){e.preventDefault();edCopy();edObjAct('del')}}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'&&ED.tool==='select'){e.preventDefault();const all=[...cur().objs,...cur().refs.filter(r=>r.vis)];if(all.length){ED.multi=all.length>1?all:[];ED.sel=all[all.length-1];edObjBar();edRenderOv()}}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){/* paste 이벤트에서 처리 */}
  else if((e.key==='Delete'||e.key==='Backspace')&&ED.area&&ED.area.closed){e.preventDefault();areaAct('del')}
  else if((e.key==='Delete'||e.key==='Backspace')&&selList().length){e.preventDefault();edObjAct('del')}
  else if(e.key==='Escape'&&(ED.sel||ED.area)){if(ED.area){ED.area=null;edRenderOv();edBar()}else edDeselect()}
  else if(e.key==='['){edSetSize(ED.size-1)}else if(e.key===']'){edSetSize(ED.size+1)}
  else if(!e.ctrlKey&&!e.metaKey){const k={v:'select',m:'area',b:'brush',p:'brush',e:'eraser',g:'fill',l:'line',t:'text',f:'fx',h:'hand',u:'shape'}[e.key.toLowerCase()];if(k)edTool(k)}});

/* ================= 시작 ================= */
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));
let _authReady=false;
sb.auth.onAuthStateChange((ev,session)=>{
  const was=ME&&ME.id;ME=session?session.user:null;
  if(!_authReady)return;
  if((ME&&ME.id)!==was){
    setTimeout(async()=>{await loadProfile();paintAuth();refreshPendingCount();checkNotices();route()},0);
  }
});
(async()=>{
  const {data}=await sb.auth.getSession();ME=data.session?data.session.user:null;
  await loadProfile();paintAuth();_authReady=true;
  route();refreshPendingCount();checkNotices();setTimeout(purgeExpired,3000);
})();
</script>
